<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tremcore Venue Posters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Anton&family=Oswald:wght@500;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&family=Alfa+Slab+One&family=Permanent+Marker&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* Tremcore: this page runs inside the app in a locked-down frame. The app hands in the saved poster settings and the business name through the frame name, and saves changes through a message. */
window.__TC=(function(){try{var o=JSON.parse(window.name||"{}");return o&&typeof o==="object"?o:{}}catch(e){return {}}})();try{window.name=""}catch(e){}
</script>
<style>
:root{
  --app-bg:#070707; --panel:#121110; --panel2:#1A1815; --line:#2A2620; --line2:#3d362a;
  --txt:#F4EEE2; --muted:#A39A88; --b1:#C9A23A; --b2:#F3D98B;
  --grad:linear-gradient(135deg,#8C6A1C 0%,#D4AF37 35%,#F6E29A 55%,#C9A23A 80%,#8C6A1C 100%);
  --serif:'Cinzel',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--app-bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{padding-bottom:90px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--b1);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 22px;background:rgba(7,7,7,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,175,55,.22)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:38px;background:url(assets/tremcore-mark.png) center/contain no-repeat;flex:none}
.brand-name{font-family:var(--serif);font-weight:600;letter-spacing:.22em;font-size:16px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.24em;text-transform:uppercase;margin-top:4px}
.steps{display:flex;align-items:center;gap:4px}
.stp{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;font-size:14px;color:var(--muted);transition:background .15s}
.stp:hover{background:var(--panel2);color:var(--txt)}
.stp .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700}
.stp.on{color:var(--txt);background:var(--panel2);font-weight:600}
.stp.on .n{background:var(--grad);color:#14110a;border:none}
.stp.done .n{border-color:rgba(212,175,55,.6);color:var(--b2)}
.stp-sep{width:18px;height:1px;background:var(--line2)}
.hdr-right{display:flex;justify-content:flex-end}
.kit-btn{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:11px;font-size:14px;display:inline-flex;align-items:center;gap:9px;color:var(--txt);transition:border-color .15s}
.kit-btn:hover{border-color:var(--b1)}
.kit-btn .dots{display:flex}
.kit-btn .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #0b0a09;margin-left:-5px;display:block}
.kit-btn .dots i:first-child{margin-left:0}
@media (max-width:820px){
  .hdr{grid-template-columns:auto 1fr auto;padding:0 12px;gap:8px}
  .brand-text{display:none}
  .stp .t{display:none}.stp{padding:5px}.stp.on .t{display:inline}.stp.on{padding-right:12px}
  .stp-sep{width:8px}
  .kit-btn .t{display:none}.kit-btn{padding:0 11px}
  .steps{justify-content:center}
}
@media (max-width:360px){.hdr{padding:0 8px;gap:4px}.stp-sep{width:4px}.steps{gap:2px}.stp.on{padding-right:8px}.stp.on .t{font-size:13px}}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:600;font-size:15px;transition:all .18s;white-space:nowrap}
.btn.pri{background:var(--grad);color:#14110a;box-shadow:0 6px 22px rgba(212,175,55,.22)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(212,175,55,.35)}
.btn.ghost{border:1px solid var(--line2);color:var(--txt)}
.btn.ghost:hover{border-color:var(--b1)}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.view{max-width:1240px;margin:0 auto;padding:30px 22px 30px}
@media (max-width:640px){.view{padding:18px 14px}}
.vhead{margin-bottom:22px}
.vhead h1{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.15;margin:6px 0 6px}
.vhead p{color:var(--muted);font-size:16px;line-height:1.5;max-width:620px}
@media (max-width:640px){.vhead h1{font-size:24px}.vhead p{font-size:14.5px}}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 7px}
.lbl:first-child{margin-top:0}
.lbl span{font-weight:400;opacity:.8}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--txt);font-size:16px;outline:none;transition:border .2s}
.field:focus{border-color:var(--b1)}
.field::placeholder{color:#6f6758}
textarea.field{min-height:120px;resize:vertical;line-height:1.5}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--b1) 50%),linear-gradient(135deg,var(--b1) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.help{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);font-size:14px;color:var(--muted);transition:border-color .15s}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.on{border-color:var(--b1);background:rgba(212,175,55,.12);color:var(--b2)}
.chip.on::before{content:'✓ ';font-weight:700}
.chips.radio .chip.on::before{content:''}
.fit{position:relative;overflow:hidden;width:100%}
.fit>.pst{position:absolute;top:0;left:0;transform-origin:0 0}

/* ---------- step 1: choose ---------- */
.welcome-band{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid rgba(212,175,55,.35);border-radius:16px;background:radial-gradient(ellipse at left,rgba(212,175,55,.12),transparent 70%),var(--panel);margin-bottom:22px}
.welcome-band .ic{font-size:28px}
.welcome-band b{display:block;font-size:15px}
.welcome-band span{font-size:13.5px;color:var(--muted)}
.welcome-band .btn{margin-left:auto}
@media (max-width:640px){.welcome-band{flex-wrap:wrap}.welcome-band .btn{margin-left:0;width:100%}}
.subh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}
.subh h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:30px}
.reg{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.reg .ic{font-size:24px}
.reg .tx{flex:1;min-width:0}
.reg b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg small{font-size:12.5px;color:var(--muted)}
.reg .x{color:var(--muted);font-size:14px;padding:4px}
.reg .x:hover{color:#ff8a8a}
.cats{margin-bottom:16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}
@media (max-width:640px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.tc{text-align:left;display:flex;flex-direction:column;gap:9px;padding:0;border-radius:14px}
.tc .fit{border-radius:10px;border:1.5px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.45);transition:border-color .15s,transform .18s}
.tc:hover .fit{border-color:var(--b1);transform:translateY(-3px)}
.tc.on .fit{border-color:var(--b1);box-shadow:0 0 0 3px rgba(212,175,55,.25),0 14px 34px rgba(0,0,0,.45)}
.tc b{font-size:14.5px;font-weight:600;display:block}
.tc small{font-size:12.5px;color:var(--muted)}

/* ---------- step 2: edit ---------- */
.edit{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:980px){.edit{grid-template-columns:minmax(0,1fr);gap:18px}.pvcol{order:-1}}
.card{background:linear-gradient(180deg,#151310,#100f0d);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:12px}
@media (max-width:640px){.card{padding:18px 16px}}
.card h3{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 .n{width:26px;height:26px;border-radius:50%;background:rgba(212,175,55,.15);color:var(--b2);display:grid;place-items:center;font-family:'Inter';font-size:12px;font-weight:700;flex:none}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h3{margin:0;flex:1}
details.card>summary .st{font-size:13px;color:var(--muted);text-align:right;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.card>summary::after{content:'+';color:var(--b1);font-size:20px;line-height:1;width:16px;text-align:center}
details.card[open]>summary::after{content:'–'}
details.card .in{padding:0 22px 20px}
@media (max-width:640px){details.card>summary{padding:16px}details.card .in{padding:0 16px 18px}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--muted)}
.days button.on{border-color:var(--b1);color:var(--b2);background:rgba(212,175,55,.1);font-weight:600}
.whenrow{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:10px}
.mini-toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted);cursor:pointer}
.sw{width:40px;height:23px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#d8d0c0;transition:transform .2s}
.on>.sw,.sw.on{background:var(--b1)}
.on>.sw::after,.sw.on::after{transform:translateX(17px);background:#14110a}
.fxlist{display:flex;flex-direction:column;gap:8px}
.fxrow{display:grid;grid-template-columns:52px 64px 1fr 16px 1fr 28px;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 8px}
.fxrow input{background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);font-size:14px;padding:6px 2px;outline:none;min-width:0;width:100%}
.fxrow input:focus{border-color:var(--b1)}
.fxrow .v{font-size:11px;color:var(--muted);text-align:center}
.fxrow .x{color:var(--muted);font-size:15px}
.fxrow .comp{grid-column:1/-1;font-size:12.5px!important;color:var(--muted)!important}
.fxtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tip{background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.25);border-radius:11px;padding:10px 12px;font-size:12.5px;color:#e9d9a6;line-height:1.45;margin-top:10px}

.pvcol{position:sticky;top:84px}
@media (max-width:980px){.pvcol{position:static}}
.pvtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.looks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 8px;width:100%}
.lk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.lk i{width:100%;max-width:48px;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);display:block;transition:border-color .15s}
.lk.on{color:var(--b2);font-weight:600}
.lk.on i{border-color:var(--b1);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.pvbox{margin:0 auto;width:min(100%,calc((100vh - 250px) * .7072))}
@media (max-width:980px){.pvbox{width:min(80%,calc(56vh * .7072))}}
.pvbox .fit{border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.pvnote{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}

/* ---------- step 3: download ---------- */
.dlsec{margin-bottom:30px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.dgrid.social{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
@media (max-width:640px){.dgrid,.dgrid.social{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.dc .thumbwrap{--th:196px;background:#0c0b0a;border-radius:10px;height:220px;display:flex;align-items:center;justify-content:center;padding:12px}
.dc .tw{width:min(100%,calc(var(--th) * var(--ar)))}
@media (max-width:640px){.dc .thumbwrap{height:150px;padding:8px;--th:134px}.dc{padding:10px}}
.dc .thumbwrap .fit{box-shadow:0 10px 26px rgba(0,0,0,.5);border-radius:3px}
.dc b{font-size:15px;display:block}
.dc small{font-size:12.5px;color:var(--muted)}
.dc .acts{display:flex;gap:6px}
.dc .acts .btn{flex:1;padding:10px 8px}
.savecard{display:grid;grid-template-columns:1fr 160px 150px auto;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
@media (max-width:760px){.savecard{grid-template-columns:1fr 1fr}.savecard .nm,.savecard .btn{grid-column:1/-1}}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(9,8,7,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(212,175,55,.2)}
.bar-in{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:12px}
.bar-mid{flex:1;text-align:center;font-size:13.5px;color:var(--muted)}
.bar-mid b{color:var(--txt)}
@media (max-width:640px){.bar-in{padding:11px 12px}.bar-mid{display:none}.bar .btn{flex:1}}

/* ---------- brand drawer ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(480px,100%);background:#0f0e0c;border-left:1px solid rgba(212,175,55,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.dr-head h2{font-family:var(--serif);font-weight:600;font-size:21px}
.dr-head p{font-size:13px;color:var(--muted);margin-top:3px}
.dr-close{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);font-size:16px;color:var(--muted)}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px}
.dr-foot{padding:14px 22px;border-top:1px solid var(--line)}
.dr-sec{margin-bottom:26px}
.dr-sec h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--b2);font-weight:700;margin-bottom:12px}
.logobox{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--panel2)}
.logobox .thumb{width:64px;height:64px;border-radius:10px;background:#0b0a09 center/contain no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{border:1.5px solid var(--line);border-radius:11px;padding:8px;background:var(--panel2);text-align:left;font-size:12.5px;color:var(--muted)}
.preset .strip{display:flex;height:24px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.preset .strip span{flex:1}
.preset.on{border-color:var(--b1);color:var(--txt)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer}
.pick input[type=color]{width:36px;height:36px;border:none;background:none;cursor:pointer;padding:0}
.pick code{display:block;color:var(--txt);font-size:12px}
.fontopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fopt{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel2);text-align:left}
.fopt .s{font-size:21px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.fopt small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.fopt.on{border-color:var(--b1);background:rgba(212,175,55,.08)}

/* ---------- overlays ---------- */
.busy{position:fixed;inset:0;z-index:90;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.orb{width:84px;height:84px;border-radius:50%;background:var(--grad);animation:glow 1.8s ease-in-out infinite;display:grid;place-items:center;font-size:32px}
@keyframes glow{50%{box-shadow:0 0 60px rgba(212,175,55,.55);transform:scale(1.05)}}
.busy h2{font-family:var(--serif);font-weight:600;font-size:22px}
.busy p{color:var(--muted);font-size:14px}
#renderHost{position:fixed;left:0;top:0;z-index:80;pointer-events:none}
.modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal-card h3{font-family:var(--serif);font-size:20px;margin-bottom:6px}
.modal-card p{color:var(--muted);font-size:14px;line-height:1.5}
.modal-card img{display:block;max-width:100%;max-height:56vh;margin:14px auto;border-radius:6px}
.modal-card .row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid var(--b1);padding:12px 20px;border-radius:12px;font-size:14px;transition:all .3s;z-index:99;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%);opacity:1}

/* ============ POSTER ============ */
.pst{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--bf);text-align:center}
.pst *{box-sizing:border-box;margin:0;padding:0}
.pst .d{position:absolute;display:none;z-index:1}
.pst-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*7) calc(var(--u)*8) calc(var(--u)*6)}
.pst-top{flex:none;display:flex;justify-content:center;align-items:center;min-height:calc(var(--u)*7)}

function tplById(id){return TPL.find(t=>t.id===id)||TPL[0]}
function templateState(id,base){
  const t=tplById(id);

    c:{kick:t.kick,h:t.h,when:t.whenText||'',lines:t.lines,badge:t.badge,cta:t.cta,small:''},

  return st;
}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function lum(h){const[r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const inkOn=h=>lum(h)>.42?'#15120d':'#FFFFFF';
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`}
function mix(h1,h2,t){const a=hexRgb(h1),b=hexRgb(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function fmtTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return m?`${h}:${String(m).padStart(2,'0')}${ap}`:`${h}${ap}`}
function nextDate(dow){const d=new Date();d.setHours(0,0,0,0);const diff=(dow-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return d}
function whenFor(dow,time){const d=nextDate(dow);return`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}${time?' · '+fmtTime(time):''}`}
function shortDate(dow){const d=nextDate(dow);return`${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}


/* ---------------- QR ---------------- */
const qrCache={};
function qrURL(text){
  if(qrCache[text])return qrCache[text];
  try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cs=8,m=2,size=(n+m*2)*cs;
    const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);
    return qrCache[text]=c.toDataURL('image/png')}catch(e){return null}
}


/* ---------------- poster ---------------- */
function parseLines(txt){return String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean)}
function posterHTML(fk,st){st=st||S;
  const f=FMT[fk],w=f.w,h=f.h,r=h/w;
  const o=r>1.6?'o-t':r>1.25?'o-p':r<.8?'o-l':'o-s';
  const u=Math.min(w,h)/100;
  const B=st.brand,look=st.look,t=tplById(st.tpl);
  let font=FONTS[B.font]||FONTS.bold;
  const chalk=look==='chalk';
  if(chalk&&B.chalkFont)font={...font,...CHALK};
  if(look==='prestige')font={...font,hf:"'Cinzel',serif",hw:700,k:.8};
  // colours
  let bg,ink,hc,kc,acc=B.a,pc,rule,fxbg;
  if(look==='bold'){bg=B.p;ink=inkOn(B.p);hc=ink;kc=acc;pc=lum(B.p)>.42?B.p:acc;}
  else if(look==='elegant'){bg=lum(B.p)<.06?B.p:mix(B.p,'#000000',.78);ink='#F5EFE3';hc='#F5EFE3';kc=acc;pc=acc;}
  else if(look==='retro'){bg='#F3E7CF';ink='#2A2018';hc=lum(B.p)<.35?B.p:'#2A2018';kc=lum(B.p)<.35?B.p:'#2A2018';pc=hc;}
  else if(look==='chalk'){bg='#2B312D';ink='#F2EFE6';hc='#F7F4EC';acc=lum(B.a)<.25?mix(B.a,'#ffffff',.55):B.a;kc=acc;pc=acc;}
  else if(look==='prestige'){bg='#0A0908';ink='#F5EFE3';acc='#D4AF37';hc='#E6C873';kc=acc;pc=acc;}
  else if(look==='neon'){bg='#0B0A12';ink='#F2F0FF';let n=lum(B.a)>=lum(B.p)?B.a:B.p;if(lum(n)<.25)n=mix(n,'#ffffff',.45);acc=n;hc='#FFFFFF';kc=acc;pc=acc;}
  else if(look==='stadium'){bg=lum(B.p)<.02?B.p:mix(B.p,'#071426',.62);ink='#FFFFFF';hc='#FFFFFF';kc=acc;pc=acc;}
  else if(look==='pop'){bg=B.a;ink=inkOn(B.a);acc=B.p;hc=Math.abs(lum(B.p)-lum(B.a))>.25?B.p:ink;kc=ink;pc=hc;}
  else if(look==='minimal'){bg='#FAFAF7';ink='#1B1A18';hc=lum(B.p)<.3?B.p:'#1B1A18';kc='#77716A';acc=lum(B.p)<.3?B.p:'#1B1A18';pc=hc;}
  else if(look==='pastel'){bg=mix(B.a,'#ffffff',.82);ink='#2A2622';hc=lum(B.p)<.3?B.p:'#2A2622';kc=hc;acc=lum(B.p)<.3?B.p:'#2A2622';pc=hc;}
  else if(look==='kraft'){bg='#C9A77C';ink='#2B1D10';hc=lum(B.p)<.12?B.p:'#2B1D10';kc='#2B1D10';acc=hc;pc=hc;}
  else {bg=lum(B.p)<.1?B.p:mix(B.p,'#000000',.35);ink='#FFFFFF';hc='#FFFFFF';acc=lum(B.a)<.3?'#E8C468':B.a;kc=acc;pc=acc;}
  if(look==='retro'&&lum(acc)>.6)acc=mix(acc,'#000000',.15);
  if(look==='bold'&&Math.abs(lum(pc)-lum(bg))<.15)pc=ink;
  rule=rgba(ink==='#FFFFFF'||lum(ink)>.5?'#ffffff':'#000000',.35);
  fxbg=lum(bg)>.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.08)';
  const accInk=inkOn(acc);

  const showIcon=st.icon&&o!=='o-l'&&!(o==='o-s'&&((t.kind==='fx'?(st.fx||[]).length:parseLines(st.c.lines).length)>2));
  const isFx=t.kind==='fx';
  const rawLines=parseLines(st.c.lines);
  const maxRows={'o-t':8,'o-p':9,'o-s':4,'o-l':4}[o];
  const lines=rawLines.slice(0,maxRows);
  const fxs=(st.fx||[]).filter(x=>x.h||x.a).slice(0,{'o-t':7,'o-p':7,'o-s':3,'o-l':4}[o]);
  const hasStamp=!!st.c.badge;

  // headline sizing
  const words=String(st.c.h||'').toUpperCase().split(/\s+/).filter(Boolean);
  const longest=Math.max(4,...words.map(x=>x.length));
  const availW=o==='o-l'?w*.5:(w-u*16)*(hasStamp&&o==='o-s'?.92:1);
  const maxH={'o-t':22,'o-p':20,'o-s':15,'o-l':20}[o]*u;
  let hs=Math.min(maxH,availW/(longest*font.k));
  const textLen=(st.c.h||'').length;
  // shrink a little when there's a lot of content
  const crowd=(isFx?fxs.length:lines.length);
  if(o==='o-s'&&crowd>3)hs*=.82;
  if(o==='o-l'&&crowd>2)hs*=.8;
  if((o==='o-p')&&crowd>6)hs*=.86;
  // body size
  let bs=u*({'o-t':4.4,'o-p':3.5,'o-s':3.1,'o-l':3.6}[o]);
  if(crowd>5)bs*=.88;
  if(chalk&&B.chalkFont)bs*=1.3;
  const fs=u*({'o-t':4,'o-p':3.4,'o-s':3.1,'o-l':3.1}[o]);

  const top=`<div class="pst-top"><div>${B.logo?`<img class="pst-logo" src="${B.logo}" alt="">`:`<div class="pst-venue">${esc(B.name)}</div>`}${B.addr&&o!=='o-l'&&o!=='o-s'?'':''}</div></div>`;
  let body='';
  if(isFx){
    body=`<div class="pst-fx">${fxs.map(x=>`<div class="fx"><div class="tm"><small>${esc(x.d)}</small><b>${esc(x.t)}</b></div><div class="tt"><b>${esc(x.h)}<em>v</em>${esc(x.a)}</b>${x.c?`<small>${esc(x.c)}</small>`:''}</div></div>`).join('')}</div>`;
    if(lines.length)body+=`<div class="pst-list">${lines.slice(0,2).map(l=>`<div class="li">${esc(l)}</div>`).join('')}</div>`;
  } else if(lines.length){
    body=`<div class="pst-list">${lines.map(l=>{const m=l.split('|');if(m.length>1){return`<div class="mr"><span class="nm">${esc(m[0].trim())}</span><span class="dots"></span><span class="pr">${esc(m.slice(1).join('|').trim())}</span></div>`}return`<div class="li">${esc(l)}</div>`}).join('')}</div>`;
  }
  const whenCls=['elegant','retro','prestige','neon','kraft'].includes(look)?'plain':'pill';
  const main=`<div class="pst-main">
    ${showIcon?`<div class="pst-icon">${t.ic}</div>`:''}
    ${st.c.kick?`<div class="pst-kick">${esc(st.c.kick)}</div>`:''}
    <h1 class="pst-h">${esc(st.c.h)}</h1>
    ${st.c.when?`<div class="pst-when ${whenCls}">${esc(st.c.when)}</div>`:''}
    ${body}
  </div>`;
  // QR
  let qr='';
  if(st.qr.on){const url=B.urls[st.qr.kind];if(url){const src=qrURL(url);const lbl=st.qr.kind==='custom'?(B.customLabel||'Scan me'):QRK[st.qr.kind].l;
    qr=src?`<div class="pst-qr"><img src="${src}" alt=""><span>${esc(lbl)}</span></div>`:''}}
  // legal
  const L=st.legal,lg=[];
  if(L.c25)lg.push('<span class="lg c25">CHALLENGE 25</span>');
  if(L.over18)lg.push('<span class="lg">Over 18s only</span>');
  if(L.drink)lg.push('<span class="lg">Please drink responsibly</span>');
  if(L.tcs)lg.push('<span class="lg">T&amp;Cs apply</span>');
  if(L.allergen)lg.push('<span class="lg al">Allergies? Please speak to a member of staff before ordering</span>');
  const legal=lg.length?`<div class="pst-legal">${lg.join('')}</div>`:'';
  const addr=B.addr?`<div class="pst-small">${esc(B.addr)}</div>`:'';
  const cta=(st.c.cta||st.c.small||B.addr)?`<div class="pst-ctawrap ${qr?'':'c'}">${st.c.cta?`<div class="pst-cta">${esc(st.c.cta)}</div>`:''}${st.c.small?`<div class="pst-small">${esc(st.c.small)}</div>`:''}${B.addr&&B.logo?`<div class="pst-small">${esc(B.name)} · ${esc(B.addr)}</div>`:addr}</div>`:'';
  const stamp=hasStamp?`<div class="pst-stamp"><span>${esc(st.c.badge)}</span></div>`:'';

  const vars=`width:${w}px;height:${h}px;--u:${u}px;--bg:${bg};--ink:${ink};--hc:${hc};--kc:${kc};--acc:${acc};--accInk:${accInk};--p:${B.p};--pc:${pc};--rule:${rule};--fxbg:${fxbg};--hf:${font.hf};--hw:${font.hw};--bf:${font.bf};--hs:${hs}px;--bs:${bs}px;--fs:${fs}px`;
  let deco='<div class="d d1"></div><div class="d d2"></div><div class="d d3"></div><div class="d d4"></div>';
  if(look==='festive'){let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;let dots='';for(let i=0;i<46;i++){const sz=(.9+rnd()*1.6)*u;dots+=`<i style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;opacity:${(.45+rnd()*.5).toFixed(2)}"></i>`}deco+=`<div class="snow">${dots}</div>`}
  let inner;
  if(o==='o-l'){
    inner=`<div class="pst-in"><div class="c1">${top}${main}</div><div class="c2">${stamp}${qr}${st.c.cta?`<div class="pst-cta">${esc(st.c.cta)}</div>`:''}${addr}${legal}</div></div>`;
  } else {
    inner=`${stamp}<div class="pst-in">${top}${main}<div class="pst-foot">${(cta||qr)?`<div class="pst-footrow">${cta}${qr}</div>`:''}${legal}</div></div>`;
  }
  return `<div class="pst look-${look} ${o}" style="${vars}">${deco}${inner}</div>`;
}

function shrinkImage(src,max){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/png'))};i.onerror=()=>res(src);i.src=src})}

function parseFixtures(txt){
  const out=[];
  String(txt).split('\n').forEach(raw=>{
    let s=raw.trim();if(!s)return;
    let c='';const br=s.match(/\(([^)]+)\)\s*$/);if(br){c=br[1];s=s.slice(0,br.index).trim()}
    const dash=s.match(/\s[-–—|]\s([^-–—|]+)$/);if(!c&&dash&&!/\d{1,2}[:.]\d{2}/.test(dash[1])){c=dash[1].trim();s=s.slice(0,dash.index).trim()}
    let t='';const tm=s.match(/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i)||s.match(/\b(\d{1,2})[:.](\d{2})\b/);
    if(tm){let h=+tm[1];const m=tm[2]||'00';const ap=(tm[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;t=String(h).padStart(2,'0')+':'+m;s=(s.slice(0,tm.index)+' '+s.slice(tm.index+tm[0].length)).trim()}
    let dd='';const dm=s.match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\b/i);if(dm){dd=dm[1][0].toUpperCase()+dm[1].slice(1,3).toLowerCase();s=(s.slice(0,dm.index)+' '+s.slice(dm.index+dm[0].length)).trim()}
    s=s.replace(/^\d{1,2}(st|nd|rd|th)?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i,'').replace(/^[\s,:\-–]+|[\s,:\-–]+$/g,'');
    const v=s.split(/\s+(?:v|vs|vs\.|versus|-)\s+/i);
    if(v.length>=2)out.push({d:dd,t:t,h:v[0].trim(),a:v.slice(1).join(' ').trim(),c});
  });
  return out.slice(0,10);
}

let dlP=null;
function initDL(){if(dlP)return;dlP=Promise.resolve({save:async function(o){var u=URL.createObjectURL(o.data);var a=document.createElement('a');a.href=u;a.download=o.filename||'poster';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)}})}
setTimeout(initDL,0);
let lastFile=null;
function busy(on,t,p){$('#busy').hidden=!on;if(t)$('#busyT').textContent=t;if(p)$('#busyP').textContent=p}
async function renderCanvas(fk){
  if(!window.html2canvas)throw new Error('Image engine did not load — check your connection and refresh.');
  await document.fonts.ready;
  const f=FMT[fk],host=$('#renderHost');
  host.innerHTML=posterHTML(fk,fk==='a1'?{...S,look:'chalk'}:S);
  const el=host.firstElementChild;
  await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  await new Promise(r=>setTimeout(r,60));
  try{
    return await html2canvas(el,{scale:f.scale,backgroundColor:null,useCORS:true,logging:false,width:f.w,height:f.h,windowWidth:Math.max(f.w,innerWidth),windowHeight:Math.max(f.h,innerHeight),scrollX:0,scrollY:0});
  }finally{host.innerHTML=''}
}
const slug=()=>((S.brand.name||'venue')+'-'+(S.c.h||'poster')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
async function exportPNG(fk){
  busy(true,'Creating your poster…',FMT[fk].print?'Rendering at print quality':'Sized for '+FMT[fk].n);
  try{const c=await renderCanvas(fk);const b=await toBlob(c,'image/png');busy(false);await deliver(`${slug()}-${fk}.png`,b,c.toDataURL('image/png'))}
  catch(e){busy(false);toast(e.message||'Something went wrong')}
}
async function exportPDF(fk){
  const f=FMT[fk];busy(true,'Building your print PDF…',`${f.s} · ${f.mm[0]}×${f.mm[1]}mm`);
  try{
    if(!window.jspdf)throw new Error('PDF engine did not load — try PNG instead.');
    const c=await renderCanvas(fk);
    const pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:f.mm,compress:true});
    pdf.addImage(c.toDataURL('image/jpeg',.94),'JPEG',0,0,f.mm[0],f.mm[1]);
    const b=pdf.output('blob');busy(false);
    await deliver(`${slug()}-${fk}.pdf`,b,c.toDataURL('image/jpeg',.85));
  }catch(e){busy(false);toast(e.message||'Something went wrong')}
}
async function exportZip(){
  busy(true,'Creating your social pack…','Instagram post, Story and Facebook post');
  try{
    if(!window.JSZip)throw new Error('Zip engine did not load — download each size instead.');
    const z=new JSZip();let prev;
    for(const k of ['ig','story','fb']){const c=await renderCanvas(k);z.file(`${slug()}-${k}.png`,await toBlob(c,'image/png'));if(k==='ig')prev=c.toDataURL('image/jpeg',.85)}
    const b=await z.generateAsync({type:'blob'});busy(false);
    await deliver(`${slug()}-social-pack.zip`,b,prev);
  }catch(e){busy(false);toast(e.message||'Something went wrong')}
}
async function deliver(name,blob,previewSrc){
  lastFile={name,blob,previewSrc};initDL();
  const dl=dlP?await Promise.race([dlP,new Promise(r=>setTimeout(()=>r(null),1500))]).catch(()=>null):null;
  if(dl){const ok=await saveFile(name,blob,false,dl);if(ok)return}
  showResult(previewSrc,name,!!dl);
}
async function saveFile(name,blob,fromModal,dlIn){
  const dl=dlIn||(dlP?await dlP.catch(()=>null):null);
  if(!dl){toast('Saving isn’t available here — press and hold the image to save');return false}
  try{await dl.save({filename:name,data:blob});toast('Saved ✓ '+name);$('#modal').hidden=true;return true}
  catch(e){const c=e&&e.code;if(c==='declined'){toast('Download cancelled');return true}
    if(c==='rate_limited'){toast('One moment — a save is already open');return true}
    if(!fromModal)return false;toast('Couldn’t save here — press and hold the image instead');return false}
}
function showResult(src,name,canSave){
  $('#modalCard').innerHTML=`<h3>Your poster is ready</h3><p>${canSave?'Tap Save to download it, or ':''}press and hold (or right-click) the image to save it.</p>${src?`<img src="${src}" alt="Finished poster">`:''}<div class="row"><button class="btn ghost" data-act="modalclose">Close</button>${canSave?`<button class="btn pri" data-act="modalsave">⬇ Save ${esc(name.split('.').pop().toUpperCase())}</button>`:''}</div>`;
  $('#modal').hidden=false;
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});


/* ---------------- boot ---------------- */
renderView();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>fitAll(),100)});
if(document.fonts)document.fonts.ready.then(()=>fitAll());
</script>
</body>
</html>
