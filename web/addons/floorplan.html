<!doctype html>
<!--
  TREMCORE FLOOR PLAN (stand-alone module, taken from the Tremcore Fully Compliant app)

  One self-contained file: open it in any browser, or drop it into the hub as its own page
  or inside an <iframe>. Works on iPhone, Android, tablets and desktop.

  What it does
   - Draw a building (Room, Wall or By size), Ground to 5th floor, with live measurements,
     auto-scaling, zoom/pinch and a magnifier for accurate placement.
   - Stairs, internal walls, doors, windows and furniture: move (✥), resize, rotate (↻), place (✓).
   - Coloured key points: Fire panel, Gas shut-off valve, Mains stop cock, Electrical services,
     each with an optional photo and "how to use it" description.
   - Finish: tidies the sketch, makes a clean printable view, a QR code page, an A4 PDF poster,
     a visitor view (swipe between floors) and the liability notice.

  Dependencies (loaded from the web)
   - qrcodejs 1.0.0 (cdnjs) for the QR codes
   - Google Fonts: Cinzel and Inter (optional, falls back to system fonts)

  Where data is kept (on the device, per browser)
   - localStorage key "trem_plans": every floor (walls, items, labels, scale) and its
     "published" copy (what the QR code shows, saved when Finish is pressed).
   - IndexedDB database "tremcore", store "docs": photos added to the coloured dots
     (falls back to a smaller copy inside the plan if IndexedDB is blocked).

  To make the QR code work for the public, the hub needs to:
   1. Save each floor's "published" object to your server when Finish is pressed
      (see fpFinishPlan) along with any dot photos (fpPhotoUrl / idbGet).
   2. Serve a read-only page at PLAN_URL() that shows those floors. The visitor view
      (fpVisitorView) is exactly what that page should show.
   3. Set SITE and PLAN_URL in the CONFIG block at the top of the script.
-->

(function () {

  // For each version 1..15 at level M: error-correction codewords per block, then the blocks as [count, data codewords each].

    [10, [[1, 16]]], [16, [[1, 28]]], [26, [[1, 44]]], [18, [[2, 32]]], [24, [[2, 43]]], [16, [[4, 27]]], [18, [[4, 31]]],
    [22, [[2, 38], [2, 39]]], [22, [[3, 36], [2, 37]]], [26, [[4, 43], [1, 44]]], [30, [[1, 50], [4, 51]]], [22, [[6, 36], [2, 37]]],
    [22, [[8, 37], [1, 38]]], [24, [[4, 40], [5, 41]]], [24, [[5, 41], [5, 42]]]];
  const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70]];
  const dataWords = (v) => M[v][1].reduce((a, b) => a + b[0] * b[1], 0);

  function gmul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; }
  function divisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = gmul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = gmul(root, 2); }
    return r;
  }
  function remainder(data, div) {
    const r = new Array(div.length).fill(0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gmul(c, f); }); }

  }

  function codewords(bytes, v) {
    const bits = []; const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach((b) => put(b, 8));
    const cap = dataWords(v) * 8; put(0, Math.min(4, cap - bits.length)); while (bits.length % 8) bits.push(0);
    const out = []; for (let i = 0; i < bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8).join(''), 2));

      let p = 0; const lines = [];
      for (let y = 0; y < size; y++) lines.push(mod[y].map((d) => (d ? '1' : '0')).join(''));
      for (let x = 0; x < size; x++) lines.push(mod.map((row) => (row[x] ? '1' : '0')).join(''));

      let dark = 0; mod.forEach((row) => row.forEach((d) => { if (d) dark++; })); p += (Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1) * 10;
      return p;
    };

    for (let m = 0; m < 8; m++) { flip(m); drawFormat(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } flip(m); }

    return mod;
  }

let tt;
function toast(m){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=m; $('#app').append(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),2200); }
/* key: when the same panel is redrawn (e.g. opening a dropdown inside it), keep its scroll position and skip the slide-in */
function sheet(html, variant, key){
  const prev=document.querySelector('.sheet'), same=key && prev && prev.dataset.key===key, top=same?prev.scrollTop:0;
  /* every pop-up gets a close (x) button in its top right */
  const X=`<button class="x-close" aria-label="Close" onclick="closeSheet(true);render()">${ic('x')}</button>`;
  let hasx=html.includes('x-close');
  if(!hasx && html.includes('<span style="width:56px"></span>')){ html=html.replace('<span style="width:56px"></span>',X); hasx=true; }
  const inject = !hasx && !html.includes('class="tf-top"') && !html.includes('class="scan-top"');
  closeSheet(); const bg=document.createElement('div'); bg.className='sheet-bg'+(same?' still':''); bg.innerHTML=`<div class="sheet ${variant||''} ${inject?'hasx':''}" role="dialog" data-key="${key||''}">${inject?`<div class="sheet-x">${X}</div>`:''}${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSheet(true); }); $('#app').append(bg);
  if(same){ bg.firstElementChild.scrollTop=top; return; }
  const f=bg.querySelector('input:not([type=file]):not([type=checkbox])'); if(f) f.focus({preventScroll:true});
}
function closeSheet(animate){

function pdfFromJpegs(pages){
  // one PDF page per JPEG; each page is A4 wide and as tall as the image needs
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ const u=typeof b==='string'?enc.encode(b):b; parts.push(u); len+=u.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+' 0 obj\n'); fn(); push('\nendobj\n'); };
  push('%PDF-1.4\n');
  const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`));
  pages.forEach((pg,i)=>{ const o=3+i*3, land=pg.w>pg.h, PW=land?841.89:595.28, PH=+(PW*pg.h/pg.w).toFixed(2), cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(o,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${o+1} 0 R >> >> /Contents ${o+2} 0 R >>`));
    obj(o+1,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`); push(pg.bytes); push('\nendstream'); });
    obj(o+2,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)); });
  const n=3+pages.length*3, xref=len;
  push(`xref\n0 ${n}\n0000000000 65535 f \n${Array.from({length:n-1},(_,i)=>String(offs[i+1]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
function fpJpegPdf(bytes, iw, ih){
  // a one-page A4 PDF holding the poster as a JPEG image
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ const u=typeof b==='string'?enc.encode(b):b; parts.push(u); len+=u.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+' 0 obj\n'); fn(); push('\nendobj\n'); };
  const PW=595.28, PH=841.89, cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); push(bytes); push('\nendstream'); });
  obj(5,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const xref=len; push(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

let sbOn=false, sbRO=null;
function sbSet(on){

  if(on && window.ResizeObserver){ sbRO=new ResizeObserver(sbUpdate); sbRO.observe($('#main')); const sc=$('#main .screen'); if(sc) sbRO.observe(sc); }

function sbUpdate(){
  if(!sbOn) return; const m=$('#main'), bar=$('#sbar'), tr=$('#sb-track'), th=$('#sb-thumb');
  bar.style.top=m.offsetTop+'px'; bar.style.height=m.clientHeight+'px';
  const max=m.scrollHeight-m.clientHeight, H=tr.clientHeight;
  bar.style.visibility = max>4 ? 'visible' : 'hidden';
  const tH=Math.max(36, H*m.clientHeight/Math.max(m.scrollHeight,1)); th.style.height=tH+'px';
  th.style.transform=`translateY(${max>0?(H-tH)*m.scrollTop/max:0}px)`;
  th.setAttribute('aria-valuenow', max>0?Math.round(100*m.scrollTop/max):0);
  $('#sb-up').disabled=m.scrollTop<=1; $('#sb-dn').disabled=m.scrollTop>=max-1;
}
(function sbInit(){
  const m=$('#main'), tr=$('#sb-track'), th=$('#sb-thumb'); let drag=null;
  m.addEventListener('scroll', sbUpdate, {passive:true}); window.addEventListener('resize', sbUpdate);
  const step=d=>m.scrollBy({top:d*m.clientHeight*.6, behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  $('#sb-up').addEventListener('click',()=>step(-1)); $('#sb-dn').addEventListener('click',()=>step(1));
  const ratio=()=>{ const max=m.scrollHeight-m.clientHeight, free=tr.clientHeight-th.offsetHeight; return free>0?max/free:0; };
  tr.addEventListener('pointerdown', e=>{
    if(!e.isPrimary) return; e.preventDefault();
    if(e.target!==th){ // jump so the thumb centres on the finger, then keep dragging
      const r=tr.getBoundingClientRect(), y=e.clientY-r.top-th.offsetHeight/2; m.scrollTop=y*ratio(); }
    drag={y:e.clientY, top:m.scrollTop}; th.classList.add('drag'); try{ tr.setPointerCapture(e.pointerId); }catch(_){}
  });
  tr.addEventListener('pointermove', e=>{ if(drag) m.scrollTop=drag.top+(e.clientY-drag.y)*ratio(); });
  const end=()=>{ drag=null; th.classList.remove('drag'); };
  tr.addEventListener('pointerup', end); tr.addEventListener('pointercancel', end);
  th.addEventListener('keydown', e=>{ const k={ArrowUp:-40,ArrowDown:40,PageUp:-m.clientHeight*.8,PageDown:m.clientHeight*.8}[e.key]; if(k){ e.preventDefault(); m.scrollBy({top:k}); }
    if(e.key==='Home'){ e.preventDefault(); m.scrollTop=0; } if(e.key==='End'){ e.preventDefault(); m.scrollTop=m.scrollHeight; } });
})();

}
async function fpDotPhoto(id, files){
  const f=files&&files[0]; if(!f){ toast('No photo was chosen'); return; } toast('Adding photo…'); const p=curPlan(), it=p.items.find(z=>z.id===id); if(!it) return;
  const keep=$('#fpd-desc'); if(keep) it.desc=keep.value.trim();
  let img; const u=URL.createObjectURL(f); try{ img=await scLoad(u); }catch(e){ URL.revokeObjectURL(u); toast('That photo couldn’t be opened'); return; }
  const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)), c=scCanvas(Math.round(img.naturalWidth*k), Math.round(img.naturalHeight*k));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));
  let key='fpdot-'+id+'-'+Date.now();
  if(blob && await idbPut(key,blob)) fpPhotos[key]=URL.createObjectURL(blob);
  else { // file storage blocked here: keep a smaller copy inside the plan instead
    const k2=Math.min(1,1000/Math.max(c.width,c.height)), c2=scCanvas(Math.round(c.width*k2),Math.round(c.height*k2)); c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height); key=c2.toDataURL('image/jpeg',.72); }
  it.photo=key; savePlans(); fpRedraw(); fpItemSheet(id); toast('Photo added');
}
function fpDotPhotoDel(id){ const it=curPlan().items.find(z=>z.id===id); if(!it) return; const keep=$('#fpd-desc'); if(keep) it.desc=keep.value.trim(); delete it.photo; savePlans(); fpRedraw(); fpItemSheet(id); }
function fpDotSave(id){ const it=curPlan().items.find(z=>z.id===id), el=$('#fpd-desc'); if(it && el){ it.desc=el.value.trim(); savePlans(); } closeSheet(true); fpRefresh(); }

/* the text bubble that opens from a dot on a finished plan */
function fpDotInfo(e, planId, itemId){
  e.stopPropagation(); fpBubbleClose();
  const pl=plans.find(x=>x.id===planId), pub=pl&&pl.published, it=pub&&pub.items.find(z=>z.id===itemId); if(!it) return;
  const sample=!it.photo && !!it.desc, owner=!e.currentTarget.closest('.sheet'), d=FP_ITEMS[it.type], app=$('#app'), ar=app.getBoundingClientRect(), dr=e.currentTarget.getBoundingClientRect();
  const b=document.createElement('div'); b.className='fpb'; b.setAttribute('role','dialog'); b.setAttribute('aria-label',d.n);
  b.innerHTML=`<div class="fpb-h"><i style="background:${d.mark}"></i><b>${d.n}</b><span class="fpb-fl">${FLOORS[pl.floor]}</span><button aria-label="Close" onclick="fpBubbleClose()">${ic('x')}</button></div>
    ${it.photo||sample?`<button class="fpb-ph" onclick="fpLightbox(this.querySelector('img').src,'${esc(d.n)}')" aria-label="Open photo full screen"><img alt="${sample?'Sample picture':'Photo'} of the ${esc(d.n.toLowerCase())}" ${sample?`src="${fpSamplePhoto(it.type)}"`:''}>${sample?'<em class="fpb-sample">Sample photo</em>':''}<span>${ic('plus')}Tap to enlarge</span></button>`:''}
    ${it.desc?`<p>${esc(it.desc)}</p>`:(it.photo?'':`<p class="fpb-none">No photo or description added yet.</p>`)}
    ${owner?`<button class="fpb-edit" onclick="fpDotEdit('${planId}','${itemId}')">${ic(it.photo||it.desc?'pen':'camera')} ${it.photo||it.desc?'Edit photo &amp; description':'Add photo &amp; description'}</button>`:''}
    <span class="fpb-arrow"></span>`;
  app.append(b);
  const place=()=>{ const w=Math.min(290, ar.width-24), cx=dr.left+dr.width/2-ar.left; b.style.width=w+'px';
    const h=b.offsetHeight, left=Math.max(12, Math.min(ar.width-w-12, cx-w/2)), up=dr.top-ar.top>h+70;
    b.style.left=left+'px'; b.style.top=(up ? dr.top-ar.top-h-12 : dr.bottom-ar.top+12)+'px'; b.classList.toggle('below',!up);
    b.querySelector('.fpb-arrow').style.left=Math.max(16,Math.min(w-16,cx-left))+'px'; };
  place(); if(sample){ const im=b.querySelector('.fpb-ph img'); if(im){ im.onload=place; } }
  if(it.photo) fpPhotoUrl(it.photo).then(u=>{ const im=b.querySelector('.fpb-ph img'); if(!im) return; if(u){ im.onload=place; im.src=u; } else b.querySelector('.fpb-ph').outerHTML='<p class="fpb-none">The photo isn’t stored on this device.</p>'; });
  setTimeout(()=>{ document.addEventListener('pointerdown', fpBubbleOutside, true); },0);
  // close when the page is properly scrolled or swiped, not on the small nudge a tap can cause
  setTimeout(()=>['#main','.sheet','#fv-swipe'].forEach(sel=>{ const el=$(sel); if(!el) return; const y0=el.scrollTop, x0=el.scrollLeft;
    const h=()=>{ if(!document.querySelector('.fpb')){ el.removeEventListener('scroll',h); return; } if(Math.abs(el.scrollTop-y0)>40 || Math.abs(el.scrollLeft-x0)>40){ el.removeEventListener('scroll',h); fpBubbleClose(); } };
    el.addEventListener('scroll', h, {passive:true}); }), 350);
}
function fpDotEdit(planId,itemId){ fpBubbleClose(); fp.finished=false; fp.plan=planId; fp.mode='items'; fp.chain=null; render();
  if(curPlan().items.some(z=>z.id===itemId)) fpItemSheet(itemId); else toast('That dot has been removed from the plan'); }
function fpBubbleOutside(e){ if(!e.target.closest('.fpb') && !e.target.closest('.fpl')) fpBubbleClose(); }
function fpBubbleClose(){ document.querySelectorAll('.fpb').forEach(x=>x.remove()); document.removeEventListener('pointerdown', fpBubbleOutside, true); }
function fpLightbox(u, title){
  if(!u) return;
  const l=document.createElement('div'); l.className='fpl'; l.setAttribute('role','dialog'); l.setAttribute('aria-label',title+' photo');
  l.innerHTML=`<div class="fpl-top"><b>${title}</b><button aria-label="Close photo">${ic('x')}</button></div><img src="${u}" alt="Photo of the ${title.toLowerCase()}">`;
  l.addEventListener('click',()=>l.remove()); $('#app').append(l);
}


/* ----- floor plan disclaimer (shown in the app, to visitors and on the printed poster) ----- */
const FP_DISC = d => `Important notice: This floor plan records the locations of emergency shut-off points (including gas, water and electricity isolation points) and fire safety and other safety equipment as found and verified at the time of audit on ${fmt(d)}. It is provided as a guide only, is not a measured survey, and does not replace on-site signage, the premises fire risk assessment or the instructions of the responsible person or the emergency services. The occupier is responsible for keeping this plan accurate and up to date. If any equipment, shut-off point or facility is moved, removed, replaced, added or altered after the date of audit, Tremcore Ltd accepts no responsibility or liability for any loss, damage, injury, cost or claim arising from any resulting inaccuracy, or from reliance on this plan after that date. Nothing in this notice excludes or limits any liability that cannot lawfully be excluded or limited, including liability for death or personal injury caused by negligence.`;
const FP_DISC_SHORT = d => `Important notice: Locations of emergency shut-offs and safety equipment are shown as found and verified at audit on ${fmt(d)} and are a guide only. The occupier must keep this plan up to date. Tremcore Ltd accepts no liability for any loss, damage or injury arising from equipment or facilities being moved, removed or altered after that date, or from reliance on an out-of-date plan. This does not limit any liability that cannot lawfully be excluded.`;
const fpDiscHTML = d => `<p class="fp-disc">${FP_DISC(d)}</p>`;
function fpWrapText(x, text, maxW){ const words=text.split(' '), lines=[]; let line=''; words.forEach(w=>{ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }); if(line) lines.push(line); return lines; }


const screens = {
plan(){ return fpScreen(); },
planqr(){
  const fl=pubFloors();
  if(!fl.length) return `<div class="empty">Finish your floor plan first, then tap Create QR.</div><button class="btn-gold" onclick="back()">Back to Floor Plan</button>`;
  return `<div class="qrbox"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><div id="fpqr"></div></div>
  <h2 class="center gold" style="font-size:16px;margin:0">Scan to View Floor Plan</h2>
  <div class="live"><span class="pulse"></span>Live code · ${fl.length} floor${fl.length>1?'s':''} · updated ${fmt(lastPub())} ${hhmm(lastPub())}</div>
  <div class="fq-floors">${FLOORS.map((n,i)=>{ const p=fl.find(x=>x.floor===i); return `<span class="${p?'on':''}">${p?ic('check'):''}${FLOOR_SHORT[i]}</span>`; }).join('')}</div>
  <p class="center" style="font-size:13px">Anyone can scan this one code to see every finished floor, swiping between them. Finish another floor, or change one and press Finish again, and the code shows it straight away, so a printed poster never needs replacing.</p>
  <button class="btn-gold" onclick="fpVisitorView()">${ic('phone')} See What Visitors See</button>
  ${fpDiscHTML(lastPub())}
  <section class="poster-card">
    <img id="fp-poster-img" alt="A4 poster with the Tremcore logo, the floor plan QR code and three steps" width="120" height="170">
    <div class="pc-body">
      <h3>Printable QR Poster</h3>
      <p class="mute">A4 poster with your logo and QR code, to display at your premises.</p>
      <div class="pc-btns">
        <button class="btn-gold" onclick="fpSavePoster('download')">${ic('down')} Download PDF</button>
        <button class="btn-line" onclick="fpSavePoster('print')">${ic('print')} Print</button>
      </div>
    </div>
  </section>`;
},
};

/* ---------- navigation (floor plan and its QR page) ---------- */
let stack = ['plan'];
const titles = {plan:'Floor Plan', planqr:'Floor Plan QR Code'};
function fadeNav(fn){ const sc=document.querySelector('.screen'); if(!sc || matchMedia('(prefers-reduced-motion: reduce)').matches) return fn(); sc.classList.add('leaving'); setTimeout(fn,190); }
function go(s, push=true){ fadeNav(()=>{ if(push && stack[stack.length-1]!==s) stack.push(s); render(); $('#main').scrollTop=0; }); }
function back(){ fadeNav(()=>{ if(stack.length>1) stack.pop(); else stack=['plan']; render(); }); }
function render(){
  if(window.fpBubbleClose) fpBubbleClose();
  const s = stack[stack.length-1], hdr = $('#hdr');
  hdr.innerHTML = `${stack.length>1?`<button class="back" aria-label="Back" onclick="back()">${ic('back')}</button>`:'<span class="spacer"></span>'}<h1>${titles[s]}</h1><span class="spacer"></span>`;
  $('#main').innerHTML = `<div class="screen">${screens[s]()}</div>`;
  if(s==='plan') fpInit();
  sbSet(s==='plan');
  if(s==='planqr') fpQRInit();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(true); });
if(window.__TC.visitor){
  document.body.classList.add('visitor-only'); $('#hdr').innerHTML='';
  if(!pubFloors().length){ $('#main').innerHTML='<div class="screen"><p style="text-align:center;padding:40px 20px;color:#ccc">There are no floor plans to show for these premises yet.</p></div>'; }
  else { fpVisitorView(); const b=document.querySelector('.sheet-bg'); if(b) b.classList.add('vis-main'); window.__TC.visitorOpen=true; }
} else render();
</script>
