<title>Tremcore Compliance Passport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky shell with a mode switch. Client app is a phone-width column; hub is a left rail plus workspace.
   Brand: warm black and brass gold. Compliance status colours (green/amber/red/missing) are kept apart from the gold accent. */
:root{
  --bg:#000000; --surface:#0e0d0a; --surface2:#16140f; --line:#2c2819;
  --fg:#f2eee2; --muted:#9d957f;
  --gold:#d4af55; --gold-fill:#c9a24a; --gold-ink:#16110a;
  --green:#3dbb76; --amber:#f2902f; --red:#f0545a; --missing:#8f8978;
  --paper:#f8f5ec; --paper-ink:#1b1710;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-b:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --logo-bg:transparent;
  color-scheme:dark;
}
:root[data-bg="white"]{
  --bg:#ffffff; --surface:#f7f6f2; --surface2:#edebe4; --line:#d6d2c4;
  --fg:#17150f; --muted:#5f5a48; --gold:#85650f;
  --green:#18794a; --amber:#b05807; --red:#c5303a; --missing:#66614f;
  --logo-bg:#000000; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-b);
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}h2{font-size:24px}h3{font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
.eyebrow{font:600 11px var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;background:var(--logo-bg);border-radius:8px;padding:2px 10px 2px 4px}
.brand .lg-mark{height:46px;width:auto;display:block}
.brand .lg-word{height:20px;width:auto;display:block}
.logo-card{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo-card .lg-full{width:200px;max-width:100%;height:auto;background:#000;border-radius:10px;padding:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-fill);color:var(--gold-ink)}
.topr{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topr select{width:auto;max-width:100%;padding:6px 8px;font-size:13px}
.proto{font-size:11px;color:var(--muted);width:100%}

/* controls */
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
label{display:block;font:600 11px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--surface2)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.btn.sm{padding:5px 9px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);border-color:color-mix(in srgb,var(--green) 38%,transparent)}
.pill.amber{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent);border-color:color-mix(in srgb,var(--amber) 38%,transparent)}
.pill.red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent);border-color:color-mix(in srgb,var(--red) 38%,transparent)}
.pill.missing{color:var(--missing);border-style:dashed}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.pill.plain::before{display:none}
.lvl{display:inline-block;font:600 11px var(--font-b);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:4px}
.basis{display:inline-block;font:600 10px var(--font-b);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.basis.L{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.basis.S{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.basis.B{color:var(--muted);border-style:dashed}
.basis.N{color:var(--muted);border-style:dotted}
.tag{font:500 10px var(--font-m);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.note{border-left:3px solid var(--gold-fill);background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;color:var(--muted);font-size:13px}

/* client app */
.client{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:18px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chead>div{min-width:0}
.call{background:var(--gold-fill);color:var(--gold-ink);font-weight:700;padding:10px 14px;border-radius:8px;white-space:nowrap;font-size:13px}
.callp{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold-fill)}
.badge{font:600 11px var(--font-b);font-style:normal;background:var(--gold-fill);color:var(--gold-ink);border-radius:999px;padding:0 6px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--gold-fill);color:var(--gold);background:color-mix(in srgb,var(--gold-fill) 12%,transparent)}
.sum{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;min-width:140px;flex:1}
.legend .n{font:600 18px var(--font-d);text-align:right}
.group{display:flex;flex-direction:column}
.group>h3{padding:14px 0 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px}
.row:hover{border-color:var(--gold)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:600}.row .rt small{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--missing)}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.dot.missing{background:transparent;border:2px dashed var(--missing)}
svg .dn{font:600 22px var(--font-d);fill:var(--fg);text-anchor:middle}
svg .ds{font:500 7px var(--font-b);fill:var(--muted);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
.perm{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.perm summary{cursor:pointer;font-weight:600}
.perm .out{margin-top:10px;font:12px var(--font-m);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--fg);overflow-wrap:anywhere}
.alert{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;gap:12px;margin-bottom:8px}
.alert .dot{margin-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img,.ph{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph{display:grid;place-items:center;background:var(--surface2);color:var(--muted);font:500 10px var(--font-m)}

/* hub */
.hub{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:18px}
.hnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start}
.hn{padding:10px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.hn.on{background:var(--surface2);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold-fill)}
.hmain{min-width:0;display:flex;flex-direction:column;gap:20px}
.hh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--gold)}
.kpi b{font:600 34px/1 var(--font-d)}.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}.kpi.amber b{color:var(--amber)}.kpi.gold b{color:var(--gold)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.stack{display:flex;height:40px;border-radius:8px;overflow:hidden;gap:2px}
.sb{display:grid;place-items:center;font:600 14px var(--font-b);color:#0c0b09;min-width:28px}
.sb.green{background:var(--green)}.sb.amber{background:var(--amber)}.sb.red{background:var(--red)}.sb.missing{background:var(--missing)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pc:hover{border-color:var(--gold)}
.pc>div{min-width:0}.pc b{display:block;font-weight:600;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:minmax(210px,270px) minmax(0,1fr);gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:6px}
.cb{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.cb.on{border-color:var(--gold-fill);background:var(--surface2)}
.cb b{font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
td select,td input{padding:5px 8px;font-size:12px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col>h3{display:flex;justify-content:space-between;padding:2px 2px 4px;font-size:15px}
.rc{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rc b{font-weight:600}.rc .btns{display:flex;gap:6px;flex-wrap:wrap}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pkg b.price{font:600 30px var(--font-d);color:var(--gold)}
.pkg ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.yes{color:var(--green);font-weight:700}.no{color:var(--missing)}
.rc select{padding:5px 8px;font-size:12px}
.lab{display:block;font:600 11px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
label.ck{display:flex;align-items:center;gap:7px;margin:0;font:400 13px var(--font-b);letter-spacing:0;text-transform:none;color:var(--fg)}
label.ck input{width:auto}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.setc{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.setc:hover{border-color:var(--gold)}
.setc .go{color:var(--gold);font-weight:600;margin-top:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.fgrid>div{min-width:0}
.intg{display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){
  .hub{grid-template-columns:1fr}
  .hnav{flex-direction:row;overflow-x:auto;position:static;border-bottom:1px solid var(--line);padding-bottom:6px}
  .hn{white-space:nowrap}
  .cols,.split{grid-template-columns:1fr}
}

/* modal + toast */
#modal .bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:640px;margin:2vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.sheet.wide{max-width:860px}
.sh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:12px 0}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}.kv dd{margin:0;overflow-wrap:anywhere}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px;margin-top:12px;border:1px solid #cfc8b4}
.paper h4{font:700 20px var(--font-d);letter-spacing:.1em;margin:0 0 8px;text-transform:uppercase}
.paper p{font-size:13px;margin:4px 0}
.log{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.log b{color:var(--fg);font-weight:600}
#toast{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast .t{background:var(--gold-fill);color:var(--gold-ink);font-weight:600;padding:10px 16px;border-radius:10px;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.row,.pc,.kpi,.btn{transition:border-color .15s}}
/* ---------- site plans ---------- */
.pl{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:var(--font-b)}
.pl button{font-family:inherit;color:inherit;cursor:pointer}
.pl-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pl-ttl{min-width:0;margin-right:auto}.pl-ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pl-floors{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.pl-floors button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600;white-space:nowrap}
.pl-floors button[aria-selected="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.pl-floors .pl-add{border-style:dashed;color:var(--gold)}
.pl-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pl-seg button{padding:7px 12px;border:0;background:var(--surface2);font-size:13px;font-weight:600}
.pl-seg button[aria-pressed="true"]{background:var(--gold-fill);color:var(--gold-ink)}
.pl-top-r{display:flex;gap:6px}
.pl-top-r button:disabled{opacity:.4;cursor:default}
.pl-body{flex:1;min-height:0;display:flex}
.pl-tools{flex-direction:column;gap:6px;padding:10px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;width:104px;flex:none}
.pl-tools button{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600;text-align:left}
.pl-tools button[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.pl-tools button:disabled{opacity:.4;cursor:default}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;min-height:44px}
.pl-opts select{width:auto;padding:5px 8px;font-size:13px}
.pl-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:0;cursor:pointer}
.pl input[type=checkbox]{width:auto;margin:0;accent-color:var(--gold-fill)}
.pl-len{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:0}
.pl-len input{width:84px;padding:5px 8px}
.pl-hint{color:var(--muted);font-size:12.5px}
.pl-stage{position:relative;flex:1;min-height:0;background:var(--bg);overflow:hidden}
#pl-svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.pl-3dwrap{position:absolute;inset:0}
.pl-canvas{display:block;width:100%;height:100%;touch-action:none}
.pl-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
.pl-status{position:absolute;left:10px;bottom:8px;font:12px var(--font-m);color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:3px 8px;border-radius:6px;pointer-events:none}
.pl-ov{position:absolute;left:10px;bottom:10px;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.pl-ov #pl-mini{pointer-events:auto;width:200px;height:auto;border:1px solid var(--line);border-radius:10px;cursor:pointer;display:block}
.pl-ov.in #pl-mini{display:block}
.pl-dpad{display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;pointer-events:auto}
.pl-ov.in .pl-dpad{display:grid}
.pl-dpad button{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:10px;font-size:16px;touch-action:none}
.pl-dpad [data-d=f]{grid-column:2;grid-row:1}.pl-dpad [data-d=l]{grid-column:1;grid-row:2}.pl-dpad [data-d=b]{grid-column:2;grid-row:2}.pl-dpad [data-d=r]{grid-column:3;grid-row:2}
.pl-panel{width:300px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.pl-tabs{display:flex;border-bottom:1px solid var(--line)}
.pl-tabs button{flex:1;padding:11px 6px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.pl-tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold-fill)}
.pl-pbody{padding:12px;overflow-y:auto;flex:1;min-height:0}
.pl-h{font:600 11px var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 0 8px}.pl-h:first-child{margin-top:0}
.pl-chips{display:flex;flex-wrap:wrap;gap:6px}
.pl-chip{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:12.5px;font-weight:600;text-align:left;display:flex;flex-direction:column;gap:1px}
.pl-chip small{font-weight:400;color:var(--muted);font-size:11px}
.pl-chip[aria-pressed="true"]{border-color:var(--gold-fill);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.pl-f{display:block;font-size:12px;color:var(--muted);margin:0 0 10px}.pl-f input,.pl-f select{margin-top:4px;color:var(--fg)}
.pl-note,.pl-empty{font-size:12.5px;color:var(--muted);margin:8px 0}
.pl-link{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--surface2)}
.pl-inv{width:100%;border-collapse:collapse;font-size:13px}.pl-inv td{padding:5px 0;border-top:1px solid var(--line)}.pl-inv td:last-child{text-align:right;font-family:var(--font-m)}
.pl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
@media (max-width:860px){
  .pl-body{flex-direction:column}
  .pl-tools{flex-direction:row;width:auto;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:8px}
  .pl-tools button{white-space:nowrap}
  .pl-panel{width:auto;border-left:0;border-top:1px solid var(--line);height:34vh;flex:none}
  .pl-ttl b{max-width:60vw}
  .pl-ov #pl-mini{width:130px}
}
.plan-card{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.pl-peg{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--muted)}
.pl-peg #pl-turn{display:none}.pl-peg.in #pl-turn{display:inline-block}.pl-peg.in span,.pl-peg.in .pl-pegbtn{display:none}
.pl-pegbtn{cursor:grab;touch-action:none;line-height:0;padding:2px 4px;border-radius:8px;background:var(--surface2)}
.pl-ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-90%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.pl-peg.in #pl-place{display:none}.pl-peg #pl-place[aria-pressed=true]{background:var(--gold-fill);color:var(--gold-ink)}
.pl-sel3{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--gold);border-radius:10px}
.pl-drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--gold);border-radius:12px;padding:16px 12px;cursor:pointer;background:var(--surface2);color:var(--fg);margin:0 0 10px;font-size:13px}
.pl-drop span{color:var(--muted);font-size:12px}.pl-drop input{display:none}
.pl-dz{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));pointer-events:none;z-index:2}.pl-dz .pl-drop{pointer-events:auto;background:color-mix(in srgb,var(--surface) 92%,transparent)}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.sitecard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
</style>

<div id="app"></div>
<div id="modal"></div>

const BRULES=[
 [/fire risk/i,'L','The Regulatory Reform (Fire Safety) Order 2005 requires the responsible person to carry out and keep under review a fire risk assessment. This applies in England and Wales. Scotland and Northern Ireland have their own rules.'],
 [/legionella/i,'L','The Health and Safety at Work etc. Act 1974 and COSHH require the risk from legionella to be assessed and controlled. HSE guidance (L8) explains how and says to review the assessment regularly.'],
 [/asbestos/i,'L','Regulation 4 of the Control of Asbestos Regulations 2012 puts a duty to manage asbestos on whoever is responsible for non-domestic premises. This includes keeping a record and a management plan.'],
 [/f-?gas|air.?con/i,'L','The F-Gas Regulation requires leak checks and records for equipment above set gas quantities. Whether it applies depends on the equipment.'],
 [/lift/i,'L','The Lifting Operations and Lifting Equipment Regulations 1998 (LOLER) require lifts to be thoroughly examined, usually every 6 or 12 months depending on use.'],
 [/fire alarm/i,'S','The Fire Safety Order requires fire safety equipment to be kept in working order. BS 5839-1 is the accepted standard for servicing and testing, usually every 6 months.'],
 [/emergency light/i,'S','The Fire Safety Order requires escape routes to be lit. BS 5266-1 sets the monthly function test and the annual full-duration test.'],
 [/extinguisher/i,'S','The Fire Safety Order requires suitable firefighting equipment to be maintained. BS 5306-3 sets annual servicing.'],
 [/fire door/i,'S','The Fire Safety Order requires fire doors to be kept in working order. How often to inspect comes from your fire risk assessment and guidance. Multi-occupied residential buildings have extra rules under the Fire Safety (England) Regulations 2022.'],
 [/fire blanket/i,'S','Part of keeping firefighting equipment in working order under the Fire Safety Order. Usually checked as part of routine fire safety checks.'],
 [/eicr|electrical install/i,'S','The Electricity at Work Regulations 1989 require electrical systems to be maintained so they are safe. They set no fixed interval. An EICR to BS 7671 is the accepted way to show this, usually every 5 years for commercial premises.'],
 [/portable|\bpat\b/i,'S','The Electricity at Work Regulations 1989 require electrical equipment to be maintained. They set no fixed interval, so how often depends on the type of equipment and where it is used (HSE guidance).'],
 [/gas/i,'S','The Gas Safety (Installation and Use) Regulations 1998 require gas appliances to be kept safe. An annual check by a Gas Safe engineer is the accepted standard for commercial premises, and a legal duty for landlords of homes.'],
 [/water temp|flush|outlet|tank|hygiene/i,'S','Part of the legionella control scheme described in HSE guidance (L8). How often comes from your legionella risk assessment.'],
 [/extract|grease/i,'S','Normally driven by your fire risk assessment and your insurer, following BESA TR/19 for cleaning extract systems.'],
 [/hvac|ventilation|heating|mechanical|boiler/i,'B','Recommended by manufacturers and often required by insurers. Not a stand-alone legal requirement.'],
 [/pest/i,'B','Often needed to meet food hygiene or insurance requirements, but there is no fixed legal inspection.'],
 [/roof|drain|gutter/i,'B','Good practice to prevent damage, and often expected by insurers or the lease.'],
 [/window/i,'B','A scheduled service, usually set by the contract or lease.']
];
function basisOf(c){
  const rule=BRULES.find(r=>r[0].test(c.title));
  if(c.req&&c.req!=='N'&&BASIS[c.req])return {k:c.req,why:rule&&rule[1]===c.req?rule[2]:'Set by '+(c.reqBy||'the account holder')+'.'};
  return rule?{k:rule[1],why:rule[2]}:{k:'N',why:BMEAN.N};
}
const bbadge=c=>{const b=basisOf(c);return `<span class="basis ${b.k}" title="${esc(BASIS[b.k])}">${BSHORT[b.k]}</span>`};

function donut(cn,size=120){
  const total=cn.total,R=40,C=2*Math.PI*R;let acc=0,segs='';
  ['green','amber','red','missing'].forEach(k=>{const v=cn[k];if(!v)return;const len=v/total*C;
    segs+=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--${k})" stroke-width="12" stroke-dasharray="${Math.max(len-1.5,.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"${k==='missing'?' opacity=".6"':''}/>`;acc+=len});
  const inDate=cn.green+cn.amber,pct=total?Math.round(inDate/total*100):0;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${pct}% compliant: ${inDate} of ${total} items in date"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>${segs}<text x="50" y="52" class="dn">${total?pct+'%':'–'}</text><text x="50" y="63" class="ds">compliant</text></svg>`;
}

}

function saveCat(f){
  const hub=state.mode==='hub',who=hub?'Tremcore staff':'Client',v=i=>f.querySelector('#'+i);
  const title=v('f-title').value.trim();if(!title)return;
  let c=CATS.find(x=>x.id===f.dataset.id);const isNew=!c;
  if(isNew){c={id:'k'+(uid++),prop:f.dataset.prop,hist:[],stage:null,doc:null,notes:''};CATS.push(c);log(c,who,'Item added')}
  const due=v('f-due').value||null,notes=v('f-notes').value.trim(),file=v('f-file').files[0];
  if(!isNew){if(c.due!==due)log(c,who,`Due date changed from ${fmt(c.due)} to ${fmt(due)}`);if(c.notes!==notes)log(c,who,'Notes updated');if(c.title!==title)log(c,who,`Renamed from "${c.title}"`)}

  {const nr=v('f-req').value||null;if((c.req||null)!==nr){c.req=nr;c.reqBy=who;log(c,who,nr?'Legal basis set to '+BASIS[nr]:'Legal basis reset to suggested')}}

function planSvgSize(){const s=document.getElementById('pl-stage');const r=s.getBoundingClientRect();return {w:Math.max(r.width,100),h:Math.max(r.height,100)}}
function drawPlan(){
  const u=PL.ui,p=curPlan(),f=curFloor(),svg=document.getElementById('pl-svg');if(!svg)return;
  const sz=planSvgSize(),vb=u.vb;vb.h=vb.w*sz.h/sz.w;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);

  let s=`<defs><pattern id="pg1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="var(--line)" stroke-width="${Math.max(vb.w/1400,.008)}"/></pattern><pattern id="pg2" width=".1" height=".1" patternUnits="userSpaceOnUse"><path d="M.1 0H0V.1" fill="none" stroke="var(--line)" stroke-opacity=".5" stroke-width="${Math.max(vb.w/3000,.003)}"/></pattern></defs>`;

      const r=document.getElementById('pl-svg').getBoundingClientRect();u.vb.x-=(mx-d.mx)/r.width*u.vb.w;u.vb.y-=(my-d.my)/r.width*u.vb.w;

function planKey(e){
  const u=PL.ui;if(!u||!PSTATE.open)return;

  if(e.key==='Escape'){if(u.draw){finishWall()}else if(u.tool.t!=='select'){u.tool={t:'select'};u.measure=null;refresh()}else if(!typing){closePlan()}return}

function build3D(){
  const T=PL.three;if(!T)return;const u=PL.ui,p=curPlan();
  if(T.group){T.scene.remove(T.group);T.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}

  const floorMat=new THREE.MeshLambertMaterial({color:'#a89578'});
  const glassMat=new THREE.MeshLambertMaterial({color:0x8fd3f5,transparent:true,opacity:.28,side:THREE.DoubleSide});

  const pv=new THREE.Mesh(new THREE.BoxGeometry(all.x1-all.x0+3,.05,all.y1-all.y0+3.4),new THREE.MeshLambertMaterial({color:dark?0x34322d:0x98948a}));pv.position.set((all.x0+all.x1)/2,-SLAB-.0,(all.y0+all.y1)/2+.2);G.add(pv);
  const box=(g,u0,u1,y0,y1,t,mat)=>{if(u1-u0<.001||y1-y0<.001)return;const m=new THREE.Mesh(new THREE.BoxGeometry(u1-u0,y1-y0,t),mat);m.position.set((u0+u1)/2,(y0+y1)/2,0);g.add(m)};

    if(i>last)return;
    const Y=ys[i],H=f.h,Hw=room?Math.min(H,1.35):H,bb=planBBox(p,f),flags=doorFlags(f);
    // slab

    f.stairs.filter(s=>s.dir==='down').forEach(s=>{const hp=new THREE.Path();const a=-s.r*Math.PI/180*-1;[[-s.w/2,-s.d/2],[s.w/2,-s.d/2],[s.w/2,s.d/2],[-s.w/2,s.d/2]].forEach(([a0,b0],k)=>{const r=s.r*Math.PI/180,x=s.x+a0*Math.cos(r)-b0*Math.sin(r),y=s.y+a0*Math.sin(r)+b0*Math.cos(r);k?hp.lineTo(x,y):hp.moveTo(x,y)});hp.closePath();sh.holes.push(hp)});
    const sg=new THREE.ExtrudeGeometry(sh,{depth:SLAB,bevelEnabled:false});sg.rotateX(Math.PI/2);
    const slab=new THREE.Mesh(sg,floorMat);slab.position.set(0,Y,0);G.add(slab);
    // walls
    f.walls.forEach(w=>{
      const L=vlen(w);if(L<.05)return;const th=w.t,ang=Math.atan2(w.y2-w.y1,w.x2-w.x1);
      const g=new THREE.Group();g.position.set(w.x1,Y,w.y1);g.rotation.y=-ang;G.add(g);
      const ops=f.open.filter(o=>o.w===w.id).map(o=>({c:o.t*L,h:Math.min(o.wd/2,L/2),o:o})).sort((a,b)=>a.c-b.c);
      let cur=-th/2;

        if(O.sill>0)box(g,a,b,0,O.sill,th,wallMat);
        if(q.o.k==='window'||q.o.k==='shop'){const gl=new THREE.Mesh(new THREE.PlaneGeometry(b-a,O.head-O.sill),glassMat);gl.position.set((a+b)/2,(O.head+O.sill)/2,0);g.add(gl)}
        addDoor(g,q.o,a,b,O,th,Hw,flags[q.o.id]);

      const g=new THREE.Group();g.position.set(s.x,Y,s.y);g.rotation.y=-s.r*Math.PI/180;G.add(g);
      const n=Math.max(6,Math.round((H+SLAB)/.18)),rise=H+SLAB,mat=new THREE.MeshLambertMaterial({color:'#7d6a4d'});

    });

    const ex=new THREE.Group();ex.position.y=Y;G.add(ex);

function u0x(){return !curPlan().floors.some(f=>f.under)}
PA.pdfall=()=>{
  const p=curPlan();if(!PL.pdf)return;const n=Math.min(PL.pdf.n,p.floors.length);let chain=Promise.resolve();
  for(let i=0;i<n;i++){chain=chain.then(()=>renderPdfPage(i+1)).then(r=>{const f=p.floors[i],old=f.under,id=uidp('u');if(old)delete UIMG[old.id];UIMG[id]=r.url;
    const un=curFloor().under;const wm=un?un.wm:14,x=un?un.x:0,y=un?un.y:0;f.under={id:id,x:x,y:y,wm:wm,pw:r.w,ph:r.h,op:.6,inv:state.theme!=='light',name:PL.pdf.name+' (page '+(i+1)+')'}})}
  chain.then(()=>{refresh();toast('Each floor now has its own page. Check the scale on each floor.')}).catch(()=>toast('Could not read all the pages.'));
};
PI.ufile=el=>{const f=el.files&&el.files[0];if(f)loadPlanFile(f,curFloor().id)};
PI.uwm=el=>{const un=curFloor().under,v=parseFloat(el.value);if(!un||!(v>=1))return;snapshot();un.wm=v;refresh()};
PI.uop=el=>{const un=curFloor().under;if(!un)return;un.op=Math.max(.1,Math.min(1,parseFloat(el.value)/100));drawPlan()};
PI.uinv=el=>{const un=curFloor().under;if(!un)return;un.inv=el.checked;drawPlan()};
PI.upage=el=>{const un=curFloor().under;if(!un||!PL.pdf)return;const n=parseInt(el.value,10);PL.pdf.page=n;renderPdfPage(n).then(r=>{delete UIMG[un.id];const id=uidp('u');UIMG[id]=r.url;un.id=id;un.pw=r.w;un.ph=r.h;refresh()})};
document.addEventListener('dragover',e=>{if(PSTATE.open&&PL.ui&&PL.ui.edit&&e.target.closest&&e.target.closest('#plan')&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!PSTATE.open||!PL.ui||!PL.ui.edit||!e.target.closest||!e.target.closest('#plan'))return;const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();
  if(PL.ui.view!=='plan'){toast('Switch to the 2D plan, then drop the file.');return}
  if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)||f.type.startsWith('image/'))){toast('Drop a PDF or an image.');return}loadPlanFile(f,curFloor().id)});

function planCard(cl,prop){
  const ed=planEditable(prop.id);
  return `<div class="card plan-card"><div style="flex:1;min-width:220px"><div class="eyebrow">Site plan</div><h2>${esc(prop.name)}</h2><p class="muted small" style="margin:6px 0 0">Floor plans, fire safety points and a 3D model you can walk around. ${ed?'You can edit this plan.':'Tremcore maintains this plan for you. It is view-only.'}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" data-a="openPlan" data-prop="${prop.id}">Open plan</button><button class="btn" data-a="openPlan" data-prop="${prop.id}" data-v="3d">View in 3D</button></div></div>`;
}
/* ======== MULTI-SITE USERS ======== */
const USERS=[
 {id:'u-c1-2',client:'c1',name:'Leah Dunn',email:'kempston@brightwell.example',role:'site',props:['p9'],perm:'update'},
 {id:'u-c3-2',client:'c3',name:'Sam Okoro',email:'miltonkeynes@ashdown.example',role:'site',props:['p4'],perm:'update'},
 {id:'u-c3-3',client:'c3',name:'Beth Carr',email:'northampton@ashdown.example',role:'site',props:['p5'],perm:'view'},
 {id:'u-c2-2',client:'c2',name:'Gary Hill',email:'aire@northgate.example',role:'site',props:['p3'],perm:'view'}
];
const PERMS={view:'View only',update:'Update records',full:'Full access'};
function usersOf(cid){
  let us=USERS.filter(u=>u.client===cid);
  if(!us.some(u=>u.role==='super')){const c=CLI(cid);USERS.unshift({id:'u-'+cid+'-1',client:cid,name:c.contact,email:c.email,role:'super',props:[],perm:'full'});us=USERS.filter(u=>u.client===cid)}
  return us.sort((a,b)=>(a.role==='super'?0:1)-(b.role==='super'?0:1));
}
function curUser(){
  const us=usersOf(state.clientId);
  return us.find(u=>u.id===state.userId)||us[0];
}
function userProps(u,cid){const all=propsOf(cid||u.client);return u.role==='super'?all:all.filter(p=>u.props.includes(p.id))}
const effPerm=()=>state.mode==='hub'?'full':curUser().perm;
const pctOf=cn=>cn.total?Math.round((cn.green+cn.amber)/cn.total*100):null;
const worst=cn=>cn.red?'red':cn.amber?'amber':cn.missing?'missing':cn.total?'green':'missing';
function overviewView(cl,props){
  const bf=state.bfilter,mode=state.ovMode||'site',keep=c=>bf==='all'||basisOf(c).k===bf;
  const per=props.map(p=>{const items=catsOf(p.id).filter(keep);return {p:p,items:items,cn:counts(items)}});
  const allItems=per.flatMap(x=>x.items),cn=counts(allItems);
  const bchips=[['all','Any basis'],['L','Legal requirement'],['S','Industry standard'],['B','Best practice']].map(([k,l])=>`<button class="chip ${bf===k?'on':''}" data-a="bfilter" data-k="${k}">${l}</button>`).join('');
  const mchips=[['site','By site'],['group','By category'],['attn','Needs attention']].map(([k,l])=>`<button class="chip ${mode===k?'on':''}" data-a="ovmode" data-k="${k}">${l}</button>`).join('');
  let body='';
  if(mode==='site'){
    const rows=per.slice().sort((a,b)=>(pctOf(a.cn)??101)-(pctOf(b.cn)??101));
    body=`<div class="sites">${rows.map(x=>`<div class="card sitecard">${donut(x.cn,84)}<div style="flex:1;min-width:150px"><b>${esc(x.p.name)}</b><div class="small muted">${esc(x.p.addr)}</div><div class="small" style="margin-top:6px">${[x.cn.red?`<span style="color:var(--red)">${x.cn.red} overdue</span>`:'',x.cn.amber?`<span style="color:var(--amber)">${x.cn.amber} due soon</span>`:'',x.cn.missing?`<span class="muted">${x.cn.missing} no date</span>`:''].filter(Boolean).join(' · ')||'<span style="color:var(--green)">Everything in date</span>'}</div><button class="btn sm" style="margin-top:8px" data-a="openSite" data-id="${x.p.id}">Open site</button></div></div>`).join('')}</div>`;
  }else if(mode==='group'){
    const groups=['F','E','W','B','C'].filter(g=>allItems.some(c=>c.g===g));
    body=`<div class="tw"><table><thead><tr><th>Category</th>${per.map(x=>`<th>${esc(x.p.name)}</th>`).join('')}<th>All sites</th></tr></thead><tbody>${groups.map(g=>{
      const cell=cn2=>cn2.total?`<span class="dot ${worst(cn2)}" style="display:inline-block;margin-right:8px"></span><b>${pctOf(cn2)}%</b> <span class="small muted">${cn2.total} items</span>`:'<span class="muted small">None</span>';
      return `<tr><td><b>${G[g]}</b></td>${per.map(x=>`<td>${cell(counts(x.items.filter(c=>c.g===g)))}</td>`).join('')}<td>${cell(counts(allItems.filter(c=>c.g===g)))}</td></tr>`}).join('')}</tbody></table></div>`;
  }else{
    const list=allItems.filter(c=>st(c)!=='green').sort((a,b)=>(a.due||'0000').localeCompare(b.due||'0000'));
    body=list.length?list.map(c=>`<button class="row" data-a="openCat" data-id="${c.id}"><span class="dot ${st(c)}"></span><span class="rt"><b>${esc(c.title)}</b><small>${esc(PRO(c.prop).name)} · ${c.due?'Due '+fmt(c.due):'No date recorded'}</small></span>${pill(c)}</button>`).join(''):'<div class="muted">Nothing needs attention across your sites.</div>';
  }
  return `<div class="card sum">${donut(cn,124)}<div style="flex:1;min-width:160px"><div class="eyebrow" style="margin-bottom:6px">All ${props.length} sites · ${cn.total} checks</div>${legend(cn,false)}</div></div>
   <div class="chips" role="group" aria-label="Split the dashboard">${mchips}</div><div class="chips" role="group" aria-label="Filter by legal basis">${bchips}</div>${body}`;
}
function usersCard(cl){
  const us=usersOf(cl.id),ps=propsOf(cl.id);
  return `<div class="card"><div class="hh"><div><h3 style="margin:0">Users and access</h3><div class="small muted">A head office login sees every site. Each site can have its own login that sees that site only.</div></div><button class="btn sm gold" data-a="userForm" data-client="${cl.id}">+ Add user</button></div>
   <div class="tw"><table><thead><tr><th>User</th><th>Role</th><th>Sites</th><th>Access</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="muted small">${esc(u.email)}</div></td><td>${u.role==='super'?'<span class="pill gold plain">Head office</span>':'Site login'}</td><td class="small">${u.role==='super'?'All sites':userProps(u).map(p=>esc(p.name)).join(', ')||'None'}</td><td class="small">${cl.level>1?'View only':PERMS[u.perm]}</td><td style="white-space:nowrap"><button class="btn sm" data-a="previewAs" data-id="${u.id}">Preview</button> <button class="btn sm" data-a="userForm" data-client="${cl.id}" data-id="${u.id}">Edit</button> <button class="btn sm danger" data-a="delUser" data-id="${u.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function userModal(cid,id){
  const cl=CLI(cid),u=id?USERS.find(x=>x.id===id):{name:'',email:'',role:'site',props:[],perm:'view'},ps=propsOf(cid);
  openModal(`<div class="sh"><div><div class="eyebrow">${esc(cl.name)}</div><h2>${id?'Edit user':'Add user'}</h2></div><button class="btn sm" data-a="close">Close</button></div>
  <form id="userform" data-client="${cid}" data-id="${id||''}">
   <label for="uf-name">Name</label><input id="uf-name" required maxlength="60" value="${esc(u.name)}">
   <label for="uf-email">Login email</label><input id="uf-email" type="email" required maxlength="80" value="${esc(u.email)}">
   <label for="uf-role">Role</label><select id="uf-role" data-c="urole"><option value="super"${u.role==='super'?' selected':''}>Head office, sees every site</option><option value="site"${u.role==='site'?' selected':''}>Site login, sees chosen sites only</option></select>
   <div id="uf-sites" ${u.role==='super'?'hidden':''}><label>Sites this login can see</label>${ps.map(p=>`<label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;margin:4px 0;color:var(--fg)"><input type="checkbox" data-site="${p.id}" style="width:auto;margin:0" ${u.props.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div>
   <label for="uf-perm">What they can do</label>
   ${cl.level>1?`<select id="uf-perm" disabled><option>View only</option></select><div class="small muted">This client is on Level ${cl.level}, where Tremcore manages the records. Their logins are view-only.</div>`:`<select id="uf-perm">${Object.entries(PERMS).map(([k,v])=>`<option value="${k}"${u.perm===k?' selected':''}>${v}</option>`).join('')}</select><div class="small muted">View only: look, no changes. Update records: upload certificates and change dates and notes. Full access: also add and remove compliance items.</div>`}
   <div class="actions"><button class="btn gold" type="submit">${id?'Save':'Add user and send invite'}</button><button class="btn" type="button" data-a="close">Cancel</button></div></form>`);
}
function saveUser(f){
  const v=i=>f.querySelector('#'+i),cid=f.dataset.client,cl=CLI(cid),role=v('uf-role').value,sites=[...f.querySelectorAll('[data-site]')].filter(x=>x.checked).map(x=>x.dataset.site);
  if(role==='site'&&!sites.length){toast('Choose at least one site for a site login.');return}
  const rec={client:cid,name:v('uf-name').value.trim(),email:v('uf-email').value.trim(),role:role,props:role==='super'?[]:sites,perm:cl.level>1?'view':(role==='super'&&v('uf-perm').value==='view'?'view':v('uf-perm').value)};
  if(f.dataset.id){const u=USERS.find(x=>x.id===f.dataset.id);
    if(u.role==='super'&&role!=='super'&&usersOf(cid).filter(x=>x.role==='super').length<2){toast('There must be at least one head office user.');return}
    Object.assign(u,rec);closeModal();render();toast('User saved.')}
  else{rec.id='u-'+Date.now();USERS.push(rec);closeModal();render();toast('Invite sent to '+rec.email+'.')}
}
Object.assign(A,{
  ovmode:d=>{state.ovMode=d.k;render()},
  openSite:d=>{state.propId=d.id;state.ctab='passport';state.filter='all';render()},
  userForm:d=>userModal(d.client,d.id),
  delUser:d=>{const u=USERS.find(x=>x.id===d.id)||usersOf(CLI(state.hClient).id).find(x=>x.id===d.id);if(!u)return;
    if(u.role==='super'&&usersOf(u.client).filter(x=>x.role==='super').length<2){toast('There must be at least one head office user.');return}
    const i=USERS.indexOf(u);if(i>-1)USERS.splice(i,1);if(state.userId===u.id)state.userId=null;render();toast('User removed. Their login no longer works.')},
  previewAs:d=>{const u=USERS.find(x=>x.id===d.id);if(!u)return;state.mode='client';state.clientId=u.client;state.userId=u.id;const ps=userProps(u);state.propId=ps[0]?ps[0].id:state.propId;state.ctab=u.role==='super'&&ps.length>1?'all':'passport';state.filter='all';state.bfilter='all';render();window.scrollTo(0,0)}
});
Object.assign(C,{
  urole:el=>{const b=document.getElementById('uf-sites');if(b)b.hidden=el.value==='super'},
  whou:el=>{state.userId=el.value;const u=curUser(),ps=userProps(u);state.propId=ps[0].id;state.ctab=u.role==='super'&&ps.length>1?'all':'passport';state.filter='all';state.bfilter='all';render()}
});
try{const t=localStorage.getItem('tremcore-bg');if(t==='light')state.theme='light'}catch(e){}
applyTheme();
render();
