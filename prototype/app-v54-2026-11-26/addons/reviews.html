<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tremcore Review Responder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060606;--panel:#0f0e0c;--panel-2:#16140f;--raise:#1d1a14;
  --hair:rgba(201,162,74,.16);--hair-strong:rgba(201,162,74,.38);
  --text:#f2ebdc;--muted:#9a9282;--faint:#5e584d;
  --gold:#c9a24a;--gold-hi:#ecd08a;--gold-deep:#8f6a22;
  --gold-grad:linear-gradient(135deg,#f3dc9b 0%,#c9a24a 45%,#8f6a22 100%);
  --ok:#4cc98a;--ok-bg:rgba(76,201,138,.12);
  --warn:#e6b04a;--warn-bg:rgba(230,176,74,.13);
  --bad:#f0604f;--bad-bg:rgba(240,96,79,.13);
  --info:#86a8ee;--info-bg:rgba(134,168,238,.13);
  --ta:#5fcf9b;--ta-bg:rgba(95,207,155,.12);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 70% -10%,rgba(201,162,74,.09),transparent 60%),radial-gradient(800px 400px at -10% 110%,rgba(201,162,74,.05),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
::selection{background:var(--gold);color:#000}
.goldtext{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.logoMark{display:block}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{background:linear-gradient(180deg,#0b0a08,#050505);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:22px 14px;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;padding:4px 0 18px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
.brand .logoMark{width:120px}
.brand .word{font-family:var(--display);font-weight:600;letter-spacing:.32em;font-size:19px;margin-top:4px;padding-left:.32em}
.brand small{font-family:var(--display);letter-spacing:.18em;color:var(--muted);font-size:9.5px;margin-top:6px;text-transform:uppercase;text-align:center}
.navLabel{padding:10px 14px 4px;font-size:10px;letter-spacing:.22em;color:var(--faint);font-weight:700;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:#bdb5a4;position:relative;transition:background .2s,color .2s}
.nav button:hover{background:rgba(201,162,74,.06);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(201,162,74,.18),rgba(201,162,74,.02));color:var(--gold-hi)}
.nav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--gold-grad)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--gold);color:#120d03;border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:800}
.nav .badge.red{background:var(--bad);color:#fff}
.help{margin-top:auto;border:1px solid var(--hair-strong);border-radius:var(--r);padding:18px 16px;text-align:center;background:linear-gradient(180deg,rgba(201,162,74,.08),transparent)}
.help b{display:block;font-family:var(--display);font-size:14px;letter-spacing:.04em;margin:8px 0 12px;font-weight:600}
.help .tel{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--gold);border-radius:99px;padding:7px 14px;color:var(--gold-hi);font-weight:700;text-decoration:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;background:rgba(6,6,6,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 32px;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:5}
.top .title{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em}
.top .title span{font-family:var(--body);letter-spacing:.2em;font-size:10.5px;text-transform:uppercase;color:var(--gold);font-weight:700;border-left:1px solid var(--hair-strong);padding-left:14px}
.top .spacer{flex:1}
.top select{background:var(--panel);border:1px solid var(--hair-strong);border-radius:99px;padding:8px 14px;font-size:12.5px}
.who{display:flex;align-items:center;gap:10px;font-size:12.5px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--gold-grad);color:#120d03;display:grid;place-items:center;font-weight:800;font-size:12px;box-shadow:0 0 0 2px #000,0 0 0 3px var(--gold-deep)}
.who small{display:block;color:var(--muted);font-size:11px}
.topMark{display:none;height:30px}

.view{padding:28px 32px 56px;display:flex;flex-direction:column;gap:22px;max-width:1400px;width:100%;animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

.hero{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:14px;background:linear-gradient(135deg,#14110b 0%,#070707 55%);border:1px solid var(--hair);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;box-shadow:inset 0 1px 0 rgba(236,208,138,.15)}
.hero .pitch{padding:14px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero .pitch h1{font-family:var(--display);font-size:25px;line-height:1.2;letter-spacing:.02em}
.hero .pitch p{margin:0;color:var(--muted);max-width:40ch}
.kpi{all:unset;cursor:pointer;background:rgba(20,18,14,.78);border:1px solid var(--hair);border-radius:14px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--hair-strong)}
.kpi .big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.kpi .lbl{font-weight:600;font-size:13px}
.kpi .sub{font-size:11.5px;color:var(--muted)}

.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--hair);border-radius:var(--r);padding:20px 22px}
.card h2{font-family:var(--display);font-size:15px;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.card h2 svg{color:var(--gold);width:18px;height:18px}
.cardHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-weight:700;font-size:11.5px;white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.na{background:rgba(255,255,255,.05);color:var(--muted)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.src{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap}
.src.google{background:var(--info-bg);color:var(--info)}
.src.tripadvisor{background:var(--ta-bg);color:var(--ta)}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:99px;padding:9px 18px;font-weight:700;font-size:12.5px;letter-spacing:.03em;white-space:nowrap;box-sizing:border-box;transition:filter .2s,background .2s,border-color .2s,transform .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px}
.btn.gold{background:var(--gold-grad);color:#130e03;box-shadow:0 6px 18px rgba(201,162,74,.18)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{border:1px solid var(--hair-strong);color:var(--gold-hi)}
.btn.ghost:hover{border-color:var(--gold);background:rgba(201,162,74,.08)}
.btn.sm{padding:6px 13px;font-size:11.5px}
.btn[disabled]{opacity:.45;pointer-events:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,textarea{border:1px solid var(--hair-strong);border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--text)}
.toolbar input{flex:1;min-width:180px}
input::placeholder,textarea::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1px solid var(--hair);background:var(--panel);border-radius:99px;padding:7px 14px;font-weight:700;font-size:12px;color:#cfc7b6;transition:border-color .2s;white-space:nowrap}
.chip:hover{border-color:var(--hair-strong)}
.chip.on{background:var(--gold-grad);color:#130e03;border-color:transparent}
.chip i{font-style:normal;opacity:.7;margin-left:4px}

.pageHead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pageHead h1{font-family:var(--display);font-size:28px;letter-spacing:.03em;margin-top:4px}
.pageHead p{margin:6px 0 0;color:var(--muted)}

/* Inbox */
.inbox{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 230px);overflow-y:auto;padding-right:4px}
.rv{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--hair);border-left:3px solid transparent;border-radius:14px;padding:14px 16px;transition:border-color .2s,transform .2s}
.rv:hover{border-color:var(--hair-strong)}
.rv.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.rv.neg{border-left-color:var(--bad)}.rv.mid{border-left-color:var(--warn)}
.rvTop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rvWho{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv p{margin:0;color:#cfc7b6;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rvMeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars svg{width:13px;height:13px}
.bubbles{display:inline-flex;gap:3px}
.bubbles i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ta);display:inline-block}
.bubbles i.f{background:var(--ta)}
.detail{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.revBody{font-size:14.5px;line-height:1.65;color:#e9e1d0;margin:0;white-space:pre-wrap}
.revTitle{font-family:var(--display);font-size:17px;letter-spacing:.02em;margin:0 0 8px}
.dHead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.dWho{display:flex;gap:12px;align-items:center}
.dWho .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:1px solid var(--hair-strong);color:var(--gold-hi);background:rgba(201,162,74,.06)}
.dWho b{display:block;font-size:15px}
.dWho small{color:var(--muted)}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.theme{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--hair)}
.theme.pos{color:var(--ok);border-color:rgba(76,201,138,.3)}
.theme.neg{color:var(--bad);border-color:rgba(240,96,79,.3)}
.replyCard{border-color:var(--hair-strong);background:linear-gradient(180deg,#1a160e,#0c0b09)}
.tones{display:flex;gap:6px;flex-wrap:wrap}
textarea{width:100%;resize:vertical;min-height:200px;line-height:1.6;font-size:14px}
.replyFoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.replyFoot .acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.posted{border:1px solid rgba(76,201,138,.3);background:var(--ok-bg);border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:13.5px;color:#d9efe3}
.backBtn{display:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.spark{display:inline-block;width:14px;height:14px}
.thinking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* Insights */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dist{display:grid;grid-template-columns:28px 1fr 34px;gap:8px 12px;align-items:center;font-size:12.5px}
.dist .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--gold-grad);border-radius:6px}
.srcStat{display:flex;flex-direction:column;gap:6px}
.srcStat .big{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.srcStat small{color:var(--muted)}
.themeRow{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
.themeRow:first-of-type{border-top:0}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05)}
.split i{display:block;height:100%}
.chart svg{width:100%;height:auto;display:block}
.locRow{display:grid;grid-template-columns:1fr 70px 70px 80px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--hair);font-size:13px}
.locRow.h{border-top:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:0}

/* Voice + Sources */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{width:100%}
.field textarea{min-height:90px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.srcCard{display:flex;flex-direction:column;gap:12px}
.srcCard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px dashed var(--hair-strong);border-radius:14px;padding:22px;cursor:pointer;color:var(--gold-hi);font-weight:700;text-align:center}
.drop small{color:var(--muted);font-weight:500;font-size:12px}
.drop:hover,.drop.over{background:rgba(201,162,74,.06)}
code{font-size:12px;background:rgba(201,162,74,.08);border:1px solid var(--hair);border-radius:6px;padding:1px 6px;color:var(--gold-hi)}
.note{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(134,168,238,.3);background:var(--info-bg);color:#cfdcf8;border-radius:14px;padding:12px 16px;font-size:13px}
.note svg{flex:none;margin-top:2px;width:16px;height:16px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.scrim.open{display:flex}
.modal{background:linear-gradient(180deg,#17140e,#0b0a08);border:1px solid var(--hair-strong);border-radius:20px;width:min(520px,100%);max-height:90%;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;animation:rise .3s ease}
.modal h2{font-family:var(--display);font-size:19px;letter-spacing:.04em}
.modalBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:#14110b;border:1px solid var(--hair-strong);padding:12px 20px;border-radius:99px;font-weight:600;transition:transform .3s,visibility .3s;visibility:hidden;z-index:60;max-width:calc(100% - 32px);box-shadow:0 18px 40px rgba(0,0,0,.6)}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.tabbar{display:none}
.foot{text-align:center;color:var(--faint);font-size:12px;padding:8px 0 0}

/* Feedback QR */
.qrWrap{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:18px;align-items:start}
.qrPrev{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qrItem{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.qrItem img{width:100%;aspect-ratio:var(--ar,900/1260);object-fit:contain;border-radius:12px;border:1px solid var(--hair);display:block;background:#000}
.qrItem .row{display:flex;gap:6px;justify-content:space-between;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow > div{border:1px solid var(--hair);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#d8d0bf;background:rgba(0,0,0,.2)}
.flow b{display:block;font-size:13px;margin-bottom:2px}
/* Guest page */
.guest{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px;gap:18px;text-align:center;background:radial-gradient(600px 300px at 50% 0%,rgba(201,162,74,.16),transparent),var(--bg)}
.guest .logoMark{width:110px}
.guest .word{font-family:var(--display);letter-spacing:.32em;font-size:16px;margin-top:-8px;padding-left:.32em}
.guest h1{font-family:var(--display);font-size:25px;letter-spacing:.02em;line-height:1.25;max-width:20ch}
.guest p{margin:0;color:var(--muted);max-width:36ch}
.gCard{width:min(440px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--hair-strong);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gStars{display:flex;justify-content:center;gap:8px}
.gStars button{all:unset;cursor:pointer;color:var(--faint);transition:transform .15s,color .15s;padding:2px}
.gStars button svg{width:44px;height:44px}
.gStars button.f{color:var(--gold)}
.gStars button:active{transform:scale(.9)}
.gCard .btn{padding:14px 20px;font-size:14px}
.gCard textarea{min-height:110px}
.gCard input{border:1px solid var(--hair-strong);border-radius:12px;padding:12px 14px;background:var(--panel);width:100%}
.gSmall{font-size:12px;color:var(--muted)}
.gSmall a{color:var(--gold-hi)}
.gFoot{color:var(--faint);font-size:11.5px;margin-top:auto}
.guestMode .app,.guestMode .tabbar{display:none!important}
.guestOverlay{position:fixed;inset:0;z-index:55;overflow:auto;background:var(--bg)}
.guestOverlay .closeG{position:fixed;top:12px;right:12px;z-index:2}

/* Clean pass */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--hair);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.stat b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.stat small{color:var(--muted);font-size:11.5px}
.tabsRow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--hair);border-radius:99px;padding:4px;gap:4px;max-width:460px;width:100%}
.tab{all:unset;cursor:pointer;text-align:center;padding:9px 8px;border-radius:99px;font-weight:700;font-size:13px;color:#cfc7b6;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--gold-grad);color:#130e03}
.tab i{font-style:normal;opacity:.65;margin-left:6px;font-size:12px}
.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px}
.filters input,.filters select,.headSel,.toneSel select{border:1px solid var(--hair-strong);border-radius:12px;padding:10px 14px;background:var(--panel);min-width:0;width:100%;color:var(--text)}
.headSel{width:auto;border-radius:99px}
.rvLoc{font-size:11.5px;color:var(--faint);font-weight:600}
.toneSel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.toneSel select{width:auto;padding:7px 12px;border-radius:99px;font-size:12.5px}
.replyTools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.link{all:unset;cursor:pointer;color:var(--gold-hi);font-weight:700;font-size:12.5px;margin-left:16px;display:inline-flex;gap:6px;align-items:center}
.link svg{width:14px;height:14px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link[disabled]{opacity:.5;pointer-events:none}
.steps{list-style:none;margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps li{display:flex;align-items:center;gap:10px;min-width:0}
.steps li > span{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;border:1px solid var(--hair-strong);color:var(--gold-hi)}
.steps .btn{flex:1;padding:12px 14px;font-size:13px}
.secHead{margin:0 0 -6px}
.secHead h2{display:none}
.secHead h2{font-family:var(--display);font-size:19px;letter-spacing:.04em}
.secHead p{margin:4px 0 0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stepCard{display:flex;flex-direction:column;gap:14px}
.stepCard .cardHead{margin-bottom:0}
.wzN{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--gold-grad);color:#130e03;font-family:var(--body);font-size:12.5px;font-weight:800}
.pill svg{width:12px;height:12px}
.qrSide{position:sticky;top:84px}
.btn.icon{padding:7px}
.tabsRow.four{max-width:none}
.rv p{-webkit-line-clamp:2}
@media (max-width:1180px){
  .qrSide{position:static}
  .qrWrap{grid-template-columns:1fr}
  .hero{grid-template-columns:repeat(4,1fr)}
  .hero .pitch{grid-column:1/-1}
  .inbox{grid-template-columns:340px 1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topMark{display:block}
  .top{padding:10px 16px}
  .top .title{font-size:13px;letter-spacing:.06em}
  .top .title span,.who div,.top select{display:none}
  .view{padding:18px 14px 110px;gap:16px}
  .hero{grid-template-columns:1fr 1fr;border-radius:18px;padding:12px;gap:10px}
  .hero .pitch{padding:8px 6px}
  .hero .pitch h1{font-size:20px}
  .kpi .big{font-size:28px}
  .pageHead h1{font-size:22px}
  .inbox{grid-template-columns:1fr}
  .list{max-height:none;overflow:visible;padding:0}
  .inbox.showDetail .listCol{display:none}
  .view.detailMode .pageHead,.view.detailMode .stats,.view.detailMode .tabsRow,.view.detailMode .filters{display:none}
  .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -14px;padding:0 14px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{min-width:128px;padding:12px 14px}
  .stat b{font-size:22px}
  .tabsRow{max-width:none}
  .filters{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .filters input{grid-column:1/-1}
  .filters select{padding:9px 10px;font-size:12.5px}
  .steps{grid-template-columns:1fr}
  .pageHead .tabsRow{min-width:0!important}
  .tabbar{grid-template-columns:repeat(4,1fr)!important}
  .inbox:not(.showDetail) .detail{display:none}
  .detail{position:static}
  .backBtn{display:inline-flex}
  .grid2,.grid3,.formGrid{grid-template-columns:1fr}
  .card{padding:18px 16px}
  .locRow{grid-template-columns:1fr 54px 54px 64px;font-size:12px}
  .themeRow{grid-template-columns:90px 1fr 60px}
  .flow{grid-template-columns:1fr}
  .qrPrev{grid-template-columns:1fr 1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,6,6,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--muted);position:relative;padding:4px 0}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--gold-hi)}
  .tabbar .dotb{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:99px;font-size:9px;padding:0 5px;line-height:15px}
  .toast{bottom:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function seedReviews(){
  return SEED.map(([id,src,loc,author,rating,days,title,text])=>{
    const r={id,src,loc,author,rating,date:d(days),title,text,status:"new",reply:"",draft:"",repliedAt:null,demo:true};
    if(REPLIED[id]){r.status="replied";r.reply=REPLIED[id].reply;r.repliedAt=d(REPLIED[id].days)}
    return r;
  });
}
let reviews = (()=>{
  const base = seedReviews();

function persist(r){

}

 {k:"clean",label:"Cleanliness",pos:/(spotless|immaculate|very clean|so clean|clean|tidy)/i,neg:/(not (been )?cleaned|dirty|hair in|crumbs|stain|grubby|hadn't been cleaned)/i},

 {k:"comfort",label:"Beds & comfort",pos:/(comfy|comfortable|beds are amazing|bed was comfortable)/i,neg:/(uncomfortable|lumpy|smaller than expected)/i},
 {k:"heat",label:"Heating & water",pos:/(heating works)/i,neg:/(heating wouldn't|freezing|cold first night|lukewarm|hot water ran out|shower pressure|weak)/i},
 {k:"value",label:"Value",pos:/(value|price matched|reasonable price)/i,neg:/(for the price|overpriced|expensive)/i},
 {k:"punctual",label:"Punctuality",pos:/(on time|quick)/i,neg:/(late|two hours)/i},
 {k:"upkeep",label:"Upkeep",pos:/(well equipped|stylish|characterful|beautiful)/i,neg:/(wear and tear|broken|wobbly|don't seal)/i},
 {k:"parking",label:"Parking",pos:/(easy parking)/i,neg:/(parking.*tricky|no parking)/i},
 {k:"admin",label:"Booking & admin",pos:/(welcome pack)/i,neg:/(chase|invoice|booking chaos)/i}
];
function themesOf(r){
  const t=(r.title+" "+r.text);const out=[];
  THEMES.forEach(th=>{
    const n=th.neg.test(t), p=th.pos.test(t);
    if(n) out.push({k:th.k,label:th.label,s:"neg"});
    else if(p) out.push({k:th.k,label:th.label,s:"pos"});
  });
  return out;
}

/* ---------- Template reply composer (instant, offline) ---------- */
const POS_LINES = {
  clean:"we're so pleased you found everything spotless – our housekeeping team will be delighted to hear it",
  location:"we're glad the location worked so well for you",
  staff:"thank you for the kind words about the team",
  checkin:"it's great to hear check-in was smooth",
  comfort:"we're delighted you slept well",
  heat:"we're glad you were warm and cosy",
  value:"we're pleased you felt it was good value",
  punctual:"we're glad we arrived when we said we would",
  upkeep:"we're pleased you liked the space",
  admin:"we're glad the little touches made a difference",
  noise:"we're glad you had a peaceful stay",
  wifi:"we're glad the wi-fi kept you connected",
  parking:"we're glad parking was straightforward"
};
const NEG_LINES = {
  clean:"The cleanliness you describe falls well short of our standards. We've raised it directly with our housekeeping team and added an extra inspection before every arrival.",
  staff:"You should never have been left waiting, and we're reviewing how we respond to guests so it doesn't happen again.",
  checkin:"We're sorry check-in wasn't straightforward – we're reviewing our arrival process and how we keep guests informed.",
  noise:"We're sorry the noise disturbed your sleep. We're looking at improving the glazing and now provide earplugs in street-facing rooms.",
  wifi:"We're sorry about the wi-fi – our maintenance team is upgrading the connection at this property.",
  comfort:"Thank you for the honest feedback on the room – we'll make sure listings set expectations more clearly.",
  heat:"We're sorry about the heating and hot water – an engineer has inspected the system to stop this from happening again.",
  value:"We take value seriously and are sorry the stay didn't live up to the price.",
  punctual:"We're sorry we arrived late without letting you know – our team now texts customers with an updated arrival time whenever they're running behind.",
  upkeep:"Thank you for flagging the repairs – these have been passed to our maintenance team.",
  parking:"Thank you for the tip on parking – we'll add clearer parking guidance to our booking information.",
  admin:"We're sorry for the hassle on the admin side and have tightened up our process.",
  location:"Thank you for the feedback on the location."
};
function firstName(a){
  if(!a) return "";
  if(/[\d_]/.test(a) || !/\s/.test(a.trim())) return "";
  return a.trim().split(/\s+/)[0];
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function templateReply(r,tone){
  tone = tone||voice.tone;
  const fn=firstName(r.author);
  const L=LOCS[r.loc]||{name:r.loc,kind:"stay"};
  const th=themesOf(r);
  const pos=th.filter(t=>t.s==="pos"&&POS_LINES[t.k]).slice(0,2);
  const neg=th.filter(t=>t.s==="neg"&&NEG_LINES[t.k]).slice(0,3);
  const stay = L.kind==="service"?"choosing Tremcore":"staying at "+L.name;
  const greet = tone==="brief"?(fn?`Hi ${fn},`:"Hi there,"):(tone==="formal"?(fn?`Dear ${fn},`:"Dear Guest,"):(fn?`Hi ${fn},`:"Hello,"));
  const contact = [voice.phone,voice.email].filter(Boolean).join(" or ");
  let body=[];
  if(r.rating>=4){
    const open = {warm:`Thank you so much for ${stay} and for taking the time to leave such a lovely review!`,formal:`Thank you for ${stay} and for your kind review.`,brief:`Thanks so much for the ${r.rating}-star review!`,apologetic:`Thank you for ${stay} and for your review.`}[tone];
    body.push(open);
    if(pos.length && tone!=="brief") body.push(cap(pos.map(p=>POS_LINES[p.k]).join(", and ")+"."));
    if(neg.length) body.push(neg.map(n=>NEG_LINES[n.k]).slice(0,1).join(" "));
    if(voice.invite) body.push(L.kind==="service"?"We look forward to helping you again.":"We'd love to welcome you back soon.");
  } else if(r.rating===3){
    body.push(tone==="brief"?"Thanks for the honest feedback.":`Thank you for ${stay} and for your honest feedback.`);
    if(pos.length) body.push(cap(pos.map(p=>POS_LINES[p.k])[0]+", but we're sorry parts of your experience fell short."));
    else body.push("We're sorry parts of your experience fell short.");
    if(neg.length) body.push(neg.map(n=>NEG_LINES[n.k]).join(" "));
    if(voice.invite) body.push(L.kind==="service"?"We hope you'll give us the chance to get it right next time.":"We hope to welcome you back and show you the stay we're known for.");
  } else {
    body.push(tone==="brief"?"We're very sorry – this isn't the experience we want for anyone.":`Thank you for taking the time to tell us about your experience${L.kind==="service"?"":" at "+L.name}, and we're truly sorry it fell so far short.`);
    if(neg.length) body.push(neg.map(n=>NEG_LINES[n.k]).join(" "));
    else body.push("This isn't the standard we set ourselves and we're looking into what went wrong.");
    if(voice.offline && contact) body.push(`We'd really like to put this right – please get in touch on ${contact} and ask for the guest team, quoting your booking.`);
  }
  const sign = tone==="formal"?"Kind regards,":(tone==="brief"?"Thanks,":(r.rating<=2?"Sincerely,":"Warm regards,"));
  return `${greet}\n\n${body.join(" ")}\n\n${sign}\n${voice.signoff}`;
}

let sampleFn=null, sampleBusy=false, sampleCtl=null;

function buildPrompt(r,tone){
  const L=LOCS[r.loc]||{name:r.loc,city:"",kind:"stay"};
  const contact=[voice.phone,voice.email].filter(Boolean).join(" or ");
  const toneTxt={warm:"warm and personable",formal:"polished and professional",brief:"brief and friendly (3 sentences max)",apologetic:"sincerely apologetic and accountable"}[tone];
  return `You write public owner replies to customer reviews for Tremcore, a UK property company (serviced short-stay apartments and a handyman service).

Write ONE reply to the review below, ready to post on ${SRC[r.src]}.
Rules:
- British English. Tone: ${toneTxt}.
- Address the reviewer by first name if their name looks like a real name; for usernames/handles use a neutral greeting.
- Reference specific details they mentioned; never sound templated.
- For criticism: acknowledge, apologise without excuses, say concretely what is being done. Never argue or reveal private booking details.
${voice.offline&&contact?`- For ratings of 3 or below, invite them to get in touch on ${contact}.\n`:""}${voice.invite?"- If appropriate, invite them back.\n":""}${voice.avoid?`- Avoid these words/phrases: ${voice.avoid}\n`:""}- Under 120 words. No hashtags, no emojis, no subject line.
- Sign off on its own line with: ${voice.signoff}
${voice.notes?`House notes: ${voice.notes}\n`:""}
Listing: ${L.name}${L.city?", "+L.city:""}
Platform: ${SRC[r.src]}
Rating: ${r.rating}/5
Reviewer: ${r.author}
${r.title?`Title: ${r.title}\n`:""}Review: ${r.text}

Reply with the response text only.`;
}
async function claudeDraft(r,tone){
  if(!sampleFn||sampleBusy) return;
  sampleBusy=true; sampleCtl=new AbortController();
  const ta=$("#replyBox"); if(ta){ta.classList.add("thinking");ta.value="Drafting with Claude…"}
  render(true);
  try{
    const res=await sampleFn(buildPrompt(r,tone),{signal:sampleCtl.signal,cache:false,onText:({text})=>{const t=$("#replyBox");if(t&&text&&text!=="Thinking..."){t.classList.remove("thinking");t.value=text}}});
    r.draft=(res.text||"").trim(); if(r.status==="new") r.status="draft"; persist(r);
  }catch(e){
    if(e&&e.code==="not_granted"){sampleFn=null;toast("Claude drafting wasn't allowed – using the built-in writer")}
    else if(e&&e.code==="rate_limited"){toast("Claude is busy – try again in a moment")}
    else if(e&&e.name!=="AbortError"){toast("Couldn't reach Claude – kept the built-in draft")}
    if(!r.draft) r.draft=templateReply(r,tone);
  }
  sampleBusy=false; render();
}

function filtered(){

    if(st.src!=="all"&&r.src!==st.src) return false;
    if(st.status==="todo"&&r.status==="replied") return false;
    if(st.status==="replied"&&r.status!=="replied") return false;
    if(st.rating==="neg"&&r.rating>2) return false;
    if(st.rating==="mid"&&r.rating!==3) return false;

function insightsHTML(){

    <section class="card"><div class="cardHead"><h2>${I.star} Rating mix</h2><span class="hint">Avg ${avg(s).toFixed(2)}★</span></div>

function render(keepFocus){
  if(document.body.classList.contains("guestMode")) return;
  renderNav();
  const v=$("#view");
  const y=window.scrollY;
  const listEl=document.querySelector(".list"), ls=listEl?listEl.scrollTop:0;
  v.classList.toggle("detailMode",st.view==="inbox"&&st.showDetail);
  v.innerHTML = st.view==="inbox"?inboxHTML():st.view==="insights"?insightsHTML():st.view==="qr"?qrHTML():settingsHTML();
  if(st.view==="qr") drawQRs();
  const nl=document.querySelector(".list"); if(nl) nl.scrollTop=ls;

/* ---------- Events ---------- */
function go(view){st.view=view;st.showDetail=false;try{if(!window.__TREM_EMBED)history.replaceState(null,"","#"+view)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-view]"); if(b){go(b.dataset.view);return}
});
function routeHash(h){if(ALIAS[h]){st.view=ALIAS[h][0];st.sub=ALIAS[h][1];return true}if(VIEWS.some(v=>v[0]===h)){st.view=h;return true}return false}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==st.view&&routeHash(h))render()});

function sel(){return reviews.find(r=>r.id===st.sel)}
function bindView(){
  const v=$("#view");
  v.onclick=async e=>{
    const t=e.target.closest("button,[data-id],a[data-copyopen]"); if(!t) return;
    const ds=t.dataset;
    if(ds.go){ if(ds.go==="todo"){st.status="todo";st.src="all"} else if(ds.go==="replied"){st.status="replied";st.src="all"} else {st.src=ds.go;st.status="all"} st.view="inbox";render();return}
    if(t.hasAttribute("data-copyopen")){const box=$("#replyBox");if(box)copy(box.value,"Reply copied – paste it under the review, then tap “I've posted it”");return}
    if(ds.sub){st.sub=ds.sub;render();return}
    if(ds.status){st.status=ds.status;st.sel=null;render();return}
    if(ds.src){st.src=ds.src;st.sel=null;render();return}
    if(ds.rating){st.rating=ds.rating;st.sel=null;render();return}
    if(ds.id){st.sel=ds.id;st.tone=null;st.showDetail=true;render(window.innerWidth>860);if(window.innerWidth<=860)window.scrollTo(0,0);return}
    if(ds.back!==undefined&&t.hasAttribute("data-back")){st.showDetail=false;render();return}
    const r=sel();
    if(t.hasAttribute("data-tone")&&r){st.tone=ds.tone;r.draft=templateReply(r,ds.tone);persist(r);render(true);return}
    if(t.hasAttribute("data-regen")&&r){r.draft=templateReply(r,st.tone||(r.rating<=2?"apologetic":voice.tone));persist(r);render(true);toast("Draft reset");return}
    if(t.hasAttribute("data-claude")&&r){claudeDraft(r,st.tone||(r.rating<=2?"apologetic":voice.tone));return}
    if(t.hasAttribute("data-copy")&&r){copy($("#replyBox").value);return}
    if(t.hasAttribute("data-copyposted")&&r){copy(r.reply);return}
    if(t.hasAttribute("data-posted")&&r){
      const text=$("#replyBox").value.trim(); if(!text){toast("Write a reply first");return}
      r.reply=text;r.status="replied";r.repliedAt=new Date().toISOString();persist(r);
      const next=filtered().find(x=>x.status!=="replied"&&x.id!==r.id);
      toast("Marked as posted ✓"); st.sel=next&&window.innerWidth>860?next.id:r.id; st.tone=null; render(true);return}
    if(t.hasAttribute("data-reopen")&&r){r.status="draft";r.draft=r.reply;persist(r);render(true);return}
    if(t.hasAttribute("data-voicereset")){voice=Object.assign({},VOICE_DEFAULT);store.set("voice",voice);render();toast("Voice restored");return}
    if(ds.place){qrc.place=ds.place;store.set("qr",qrc);render(true);return}
    if(ds.style){qrc.style=ds.style;store.set("qr",qrc);render(true);return}
    if(t.hasAttribute("data-testguest")){testGuest();return}
    if(ds.copylink!==undefined){copy(guestLink(qrLabels()[+ds.copylink]),"Guest link copied");return}
    if(ds.dl!==undefined){if(await saveCard(+ds.dl))toast("Saved");return}
    if(t.hasAttribute("data-dlall")){const n=qrLabels().length;let ok=0;for(let i=0;i<n;i++){if(await saveCard(i))ok++;else break}if(ok)toast(`Saved ${ok} card${ok>1?"s":""}`);return}
    if(t.hasAttribute("data-import")){importText($("#paste").value);return}
    if(t.hasAttribute("data-clearimp")){const ids=new Set(store.get("imported",[]).map(r=>r.id));reviews=reviews.filter(r=>!ids.has(r.id));store.set("imported",[]);render();toast("Imported reviews removed");return}
  };
  v.onchange=e=>{const el=e.target;
    if(el.dataset.f){st[el.dataset.f]=el.value;st.sel=null;st.showDetail=false;render();return}
    if(el.hasAttribute("data-tonesel")){const r=sel();if(!r)return;st.tone=el.value;r.draft=templateReply(r,el.value);persist(r);render(true)}};
  const q=$("#q"); if(q) q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  const box=$("#replyBox"); if(box) box.oninput=()=>{const r=sel();if(!r)return;r.draft=box.value;if(r.status==="new")r.status="draft";persist(r);$("#cc").textContent=`${box.value.length} / ${r.src==="google"?4096:5000} characters`};
  const vf=$("#voiceForm"); if(vf){
    const read=()=>{const f=new FormData(vf);return {signoff:f.get("signoff")||VOICE_DEFAULT.signoff,tone:f.get("tone"),phone:f.get("phone"),email:f.get("email"),invite:!!f.get("invite"),offline:!!f.get("offline"),avoid:f.get("avoid"),notes:f.get("notes")}};
    vf.oninput=()=>{const old=voice;voice=read();const demo=reviews.find(r=>r.rating<=2)||reviews[0];$("#voicePrev").textContent=templateReply(demo,voice.tone);voice=old};
    vf.onsubmit=e=>{e.preventDefault();voice=read();store.set("voice",voice);reviews.forEach(r=>{if(r.status==="new"){r.draft=""}});toast("Brand voice saved");};
  }
  const qf=$("#qrForm"); if(qf){
    let tmr; const readQ=()=>{const f=new FormData(qf);["loc","google","trip","wa","email","phone","th","from","to","custom","base"].forEach(k=>{if(f.has(k))qrc[k]=f.get(k)});qrc.th=+qrc.th;store.set("qr",qrc)};
    qf.oninput=()=>{readQ();clearTimeout(tmr);tmr=setTimeout(drawQRs,350)};
    qf.onchange=()=>{readQ();render(true)};
    qf.onsubmit=e=>e.preventDefault();
  }
  const file=$("#file"),drop=$("#drop");
  if(file){
    file.onchange=()=>{const f=file.files[0];if(f)f.text().then(importText)};
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
    drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");const f=e.dataTransfer.files[0];if(f)f.text().then(importText)};
  }
}

/* ---------- Feedback QR ---------- */
const APP_URL = "https://claude.ai/artifact/UDTX2YSL9LV25SUALiwFfJ";
const B32="abcdefghijklmnopqrstuvwxyz234567";
function b32enc(str){const bytes=new TextEncoder().encode(str);let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(s){let bits=0,val=0;const out=[];for(const c of s){const i=B32.indexOf(c);if(i<0)continue;val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new TextDecoder().decode(new Uint8Array(out))}
const stripProto=u=>(u||"").trim().replace(/^https?:\/\//i,"");
const withProto=u=>!u?"":(/^https?:\/\//i.test(u)?u:"https://"+u);
const QR_DEFAULT={loc:"oak",google:"",trip:"",wa:"",email:"",phone:"0800 123 4567",th:4,place:"table",from:1,to:6,custom:"",style:"tent",base:""};
let qrc=Object.assign({},QR_DEFAULT,store.get("qr",{}));
function qrCfgFor(label){
  const L=LOCS[qrc.loc]||{name:qrc.loc};
  const c={n:L.name};
  if(qrc.google)c.g=stripProto(qrc.google);
  if(qrc.trip)c.t=stripProto(qrc.trip);
  if(qrc.wa)c.w=qrc.wa.replace(/[^\d]/g,"");
  if(qrc.email)c.e=qrc.email.trim();
  if(qrc.phone)c.p=qrc.phone.trim();
  if(label)c.l=label;
  if(+qrc.th!==4)c.h=+qrc.th;
  return c;
}
function guestLink(label){
  const base=(qrc.base||APP_URL).split("#")[0];
  return base+"#fb-"+b32enc(JSON.stringify(qrCfgFor(label)));
}
function qrLabels(){
  if(qrc.place==="receipt") return ["Receipt"];
  if(qrc.place==="custom") return [qrc.custom||"Feedback"];
  const word=qrc.place==="room"?"Room":"Table";
  let a=Math.max(1,parseInt(qrc.from)||1),b=Math.max(a,parseInt(qrc.to)||a); if(b-a>59)b=a+59;
  const out=[];for(let i=a;i<=b;i++)out.push(word+" "+i);return out;
}
function qrHTML(){
  const ready=!!qrc.google, contact=qrc.wa||qrc.email||qrc.phone, ok=ready&&contact;
  const labels=qrLabels();
  const opt=(k,l,cur)=>`<option value="${k}" ${String(cur)===String(k)?"selected":""}>${l}</option>`;
  const done=(b)=>b?`<span class="pill ok">${I.check}Done</span>`:`<span class="pill warn">Needed</span>`;
  return `<div class="pageHead"><div><div class="eyebrow">QR codes</div><h1>Feedback codes</h1>
    <p>Guests scan and rate. <b style="color:var(--ok)">${qrc.th}★${qrc.th<5?"+":""}</b> goes to Google; lower ratings message the manager first.</p></div></div>
  <div class="qrWrap">
    <form id="qrForm" class="stack" autocomplete="off">
      <section class="card stepCard"><div class="cardHead"><h2><span class="wzN">1</span> Review links</h2>${done(ready)}</div>
        <div class="field"><label for="q-loc">Listing</label><select id="q-loc" name="loc">${Object.entries(LOCS).map(([k,l])=>opt(k,esc(l.name),qrc.loc)).join("")}</select></div>
        <div class="field"><label for="q-g">Google review link</label><input id="q-g" name="google" inputmode="url" placeholder="g.page/r/…/review" value="${esc(qrc.google)}"><span class="hint">In Google Business Profile, tap <b>Ask for reviews</b> and copy the link.</span></div>
        <div class="field"><label for="q-t">Tripadvisor link · optional</label><input id="q-t" name="trip" inputmode="url" placeholder="tripadvisor.co.uk/UserReviewEdit-…" value="${esc(qrc.trip)}"></div>
      </section>
      <section class="card stepCard"><div class="cardHead"><h2><span class="wzN">2</span> Who hears complaints</h2>${done(contact)}</div>
        <div class="field"><label for="q-w">Manager WhatsApp</label><input id="q-w" name="wa" inputmode="tel" placeholder="44 7700 900123" value="${esc(qrc.wa)}"></div>
        <div class="formGrid">
          <div class="field"><label for="q-e">Email</label><input id="q-e" name="email" type="email" placeholder="manager@…" value="${esc(qrc.email)}"></div>
          <div class="field"><label for="q-p">Phone</label><input id="q-p" name="phone" inputmode="tel" value="${esc(qrc.phone)}"></div>
        </div>
        <div class="field"><label for="q-th">Send to Google from</label><select id="q-th" name="th">${opt(4,"4★ and 5★",qrc.th)}${opt(5,"5★ only",qrc.th)}</select></div>
      </section>
      <section class="card stepCard"><div class="cardHead"><h2><span class="wzN">3</span> Your cards</h2></div>
        <div class="field"><label>Where they go</label><div class="tabsRow four">${[["table","Tables"],["room","Rooms"],["receipt","Receipt"],["custom","Custom"]].map(([k,l])=>`<button type="button" class="tab ${qrc.place===k?"on":""}" data-place="${k}">${l}</button>`).join("")}</div></div>
        ${qrc.place==="table"||qrc.place==="room"?`<div class="formGrid"><div class="field"><label for="q-f">From</label><input id="q-f" name="from" type="number" min="1" value="${esc(qrc.from)}"></div><div class="field"><label for="q-to">To</label><input id="q-to" name="to" type="number" min="1" value="${esc(qrc.to)}"></div></div>`:""}
        ${qrc.place==="custom"?`<div class="field"><label for="q-c">Label</label><input id="q-c" name="custom" placeholder="e.g. Welcome pack" value="${esc(qrc.custom)}"></div>`:""}
        <div class="field"><label>Style</label><div class="tabsRow">${[["tent","Gold card"],["mono","Plain print"]].map(([k,l])=>`<button type="button" class="tab ${qrc.style===k?"on":""}" data-style="${k}">${l}</button>`).join("")}</div></div>
        <details><summary class="hint" style="cursor:pointer">Advanced: guest page link</summary>
          <div class="field" style="margin-top:10px"><input name="base" placeholder="${esc(APP_URL)}" value="${esc(qrc.base)}"><span class="hint">Leave blank to use this app. Share the app by public link on claude.ai so guests can open it.</span></div></details>
      </section>
    </form>
    <section class="card qrSide">
      <div class="cardHead"><h2>${I.qr} ${labels.length} card${labels.length>1?"s":""}</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-testguest>${I.eye} Preview</button>${labels.length>1?`<button class="btn gold sm" data-dlall ${ok?"":"disabled"}>${I.dl} Download all</button>`:`<button class="btn gold sm" data-dl="0" ${ok?"":"disabled"}>${I.dl} Download</button>`}</div></div>
      ${!ok?`<p class="hint" style="margin:0 0 12px">Finish steps 1 and 2 to unlock the cards.</p>`:""}
      <div class="qrPrev" id="qrPrev" style="--ar:${qrc.style==="mono"?"640/820":"900/1260"}">${labels.map((l,i)=>`<div class="qrItem" style="${ok?"":"opacity:.3"}"><img alt="QR card for ${esc(l)}" data-qi="${i}"><div class="row"><span class="hint">${esc(l)}</span><span style="display:flex;gap:4px"><button class="btn ghost sm icon" data-copylink="${i}" title="Copy link" aria-label="Copy link for ${esc(l)}">${I.copy}</button>${labels.length>1?`<button class="btn ghost sm icon" data-dl="${i}" title="Download" aria-label="Download ${esc(l)}" ${ok?"":"disabled"}>${I.dl}</button>`:""}</span></div></div>`).join("")}</div>
      <p class="hint" style="margin:14px 0 0">Can't download? Long-press a card to save it. Print table cards at least 4 cm wide.</p>
    </section>
  </div>`;
}
let qrImgs=[];
function qrMatrix(text){
  if(typeof qrcode!=="function") return null;
  const q=qrcode(0,"M");q.addData(text,"Byte");q.make();return q;
}
async function drawCard(label){
  const q=qrMatrix(guestLink(label)); if(!q) return null;
  const n=q.getModuleCount();
  const mono=qrc.style==="mono";
  const W=mono?640:900,H=mono?820:1260;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  try{await Promise.all([document.fonts.load('600 60px Cinzel'),document.fonts.load('700 30px Manrope')])}catch(e){}
  const L=LOCS[qrc.loc]||{name:""};
  if(mono){
    x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.textAlign="center";
    x.font='600 44px Cinzel, Georgia, serif';x.fillText("TREMCORE",W/2,78);
    x.font='700 30px Manrope, sans-serif';x.fillText("How was everything?",W/2,135);
    x.font='500 22px Manrope, sans-serif';x.fillText("Scan to rate us – we read every word",W/2,170);
    const size=440,cell=size/n,ox=(W-size)/2,oy=205;
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(Math.floor(ox+k*cell),Math.floor(oy+r*cell),Math.ceil(cell),Math.ceil(cell));
    x.font='700 28px Manrope, sans-serif';x.fillText(label,W/2,705);
    x.font='500 20px Manrope, sans-serif';x.fillText(L.name,W/2,745);
  } else {
    x.fillStyle="#060606";x.fillRect(0,0,W,H);
    const gl=x.createRadialGradient(W/2,0,10,W/2,0,700);gl.addColorStop(0,"rgba(201,162,74,.22)");gl.addColorStop(1,"rgba(201,162,74,0)");x.fillStyle=gl;x.fillRect(0,0,W,H);
    const gg=x.createLinearGradient(0,0,W,H);gg.addColorStop(0,"#f3dc9b");gg.addColorStop(.45,"#c9a24a");gg.addColorStop(1,"#8f6a22");
    x.strokeStyle=gg;x.lineWidth=3;rr(x,28,28,W-56,H-56,30);x.stroke();
    x.strokeStyle="rgba(201,162,74,.35)";x.lineWidth=1;rr(x,42,42,W-84,H-84,22);x.stroke();
    const logo=await loadImg(LOGO);
    if(logo){x.save();x.globalCompositeOperation="lighten";x.drawImage(logo,W/2-110,70,220,154);x.restore()}
    x.textAlign="center";x.fillStyle=gg;x.font='600 46px Cinzel, Georgia, serif';x.fillText("T R E M C O R E",W/2,272);
    x.fillStyle="#f2ebdc";x.font='600 54px Cinzel, Georgia, serif';x.fillText("How was your visit?",W/2,368);
    x.fillStyle="#9a9282";x.font='500 27px Manrope, sans-serif';x.fillText("Scan to rate us – we read every word",W/2,412);
    const size=520,pad=34,ox=(W-size)/2,oy=488;
    x.fillStyle="#f7f2e6";rr(x,ox-pad,oy-pad,size+pad*2,size+pad*2,26);x.fill();
    x.fillStyle="#0b0a08";const cell=size/n;
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(Math.floor(ox+k*cell),Math.floor(oy+r*cell),Math.ceil(cell),Math.ceil(cell));
    x.fillStyle=gg;x.font='600 50px Cinzel, Georgia, serif';x.fillText(label.toUpperCase(),W/2,1110);
    x.fillStyle="#9a9282";x.font='600 24px Manrope, sans-serif';x.fillText(L.name,W/2,1160);
  }
  return c.toDataURL("image/png");
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src})}
let drawSeq=0;
async function drawQRs(){
  const seq=++drawSeq; const labels=qrLabels(); qrImgs=[];
  if(typeof qrcode!=="function"){const p=$("#qrPrev");if(p)p.insertAdjacentHTML("beforebegin",`<div class="note" style="margin-bottom:12px">${I.info}<div>The QR library didn't load – check your connection and reopen this tab.</div></div>`);return}
  for(let i=0;i<labels.length;i++){
    const url=await drawCard(labels[i]); if(seq!==drawSeq) return;
    qrImgs[i]=url; const im=document.querySelector(`img[data-qi="${i}"]`); if(im) im.src=url;
  }
}
let dlFn; (async()=>{try{if(window.claude&&claude.use) dlFn=await claude.use("downloads")}catch(e){dlFn=null}})();
async function saveCard(i){
  const labels=qrLabels(); const url=qrImgs[i]||await drawCard(labels[i]); if(!url) return false;
  const name=`tremcore-feedback-${(LOCS[qrc.loc]||{name:"qr"}).name}-${labels[i]}.png`.toLowerCase().replace(/[^a-z0-9.]+/g,"-");
  if(!dlFn){toast("Long-press or right-click the card to save it");return false}
  try{const blob=await (await fetch(url)).blob();await dlFn.save({filename:name,data:blob});return true}
  catch(e){toast("Download cancelled – you can long-press the card to save it");return false}
}

/* ---------- Guest page ---------- */
function guestHTML(cfg,state){
  const th=cfg.h||4, r=state.rating||0, place=cfg.l&&cfg.l!=="Receipt"?` · ${esc(cfg.l)}`:"";
  const g=withProto(cfg.g), t=withProto(cfg.t);
  const stars=`<div class="gStars" role="group" aria-label="Your rating">${[1,2,3,4,5].map(i=>`<button data-gstar="${i}" class="${i<=r?"f":""}" aria-label="${i} star${i>1?"s":""}">${I.star}</button>`).join("")}</div>`;
  let body;
  if(!r){
    body=`<div class="gCard">${stars}<p class="gSmall" style="margin:0 auto">Tap a star</p></div>`;
  } else if(r>=th){
    body=`<div class="gCard">${stars}
      <h2 style="font-family:var(--display);font-size:20px">Wonderful – thank you!</h2>
      <p style="margin:0 auto">Would you share that on Google? It takes 30 seconds and really helps a small team like ours.</p>
      ${g?`<a class="btn gold" href="${esc(g)}" target="_blank" rel="noopener">Leave a Google review</a>`:""}
      ${t?`<a class="btn ghost" href="${esc(t)}" target="_blank" rel="noopener">Review us on Tripadvisor</a>`:""}
    </div>`;
  } else {
    const msg=encodeURIComponent(`Feedback – ${cfg.n}${cfg.l?" ("+cfg.l+")":""}: ${r}★\n${state.text||""}${state.name?"\n— "+state.name:""}`);
    body=`<div class="gCard">${stars}
      <h2 style="font-family:var(--display);font-size:20px">We're sorry it wasn't right</h2>
      <p style="margin:0 auto">Tell the manager now and we'll do our best to put it right${cfg.l&&cfg.l!=="Receipt"?" while you're still here":""}.</p>
      <textarea id="gText" placeholder="What could we have done better?" aria-label="Your feedback">${esc(state.text||"")}</textarea>
      <input id="gName" placeholder="Your name (optional)" value="${esc(state.name||"")}" aria-label="Your name">
      ${cfg.w?`<a class="btn gold" id="gWa" href="https://wa.me/${esc(cfg.w)}?text=${msg}" target="_blank" rel="noopener">Send to the manager on WhatsApp</a>`:""}
      ${cfg.e?`<a class="btn ${cfg.w?"ghost":"gold"}" id="gEm" href="mailto:${esc(cfg.e)}?subject=${encodeURIComponent("Feedback – "+cfg.n)}&body=${msg}">Email the manager</a><span class="gSmall">${esc(cfg.e)}</span>`:""}
      ${cfg.p?`<a class="btn ghost" href="tel:${esc(cfg.p.replace(/[^\d+]/g,""))}">Call ${esc(cfg.p)}</a>`:""}
      ${g?`<p class="gSmall" style="margin:4px auto 0">Prefer to post publicly? <a href="${esc(g)}" target="_blank" rel="noopener">Leave a Google review</a></p>`:""}
    </div>`;
  }
  return `<div class="guest">
    <img class="logoMark" src="${LOGO}" alt="Tremcore"><div class="word goldtext">TREMCORE</div>
    <div><div class="eyebrow">${esc(cfg.n)}${place}</div><h1 style="margin:8px auto 0">How was your visit?</h1></div>
    ${body}
    <div class="gFoot">Tremcore Ltd · we read every message</div></div>`;
}
function mountGuest(root,cfg){
  const state={rating:0,text:"",name:""};
  const paint=()=>{root.querySelector(".gHost").innerHTML=guestHTML(cfg,state);
    const gt=root.querySelector("#gText"),gn=root.querySelector("#gName");
    const upd=()=>{state.text=gt.value;state.name=gn.value;const msg=encodeURIComponent(`Feedback – ${cfg.n}${cfg.l?" ("+cfg.l+")":""}: ${state.rating}★\n${state.text}${state.name?"\n— "+state.name:""}`);
      const wa=root.querySelector("#gWa");if(wa)wa.href=`https://wa.me/${cfg.w}?text=${msg}`;
      const em=root.querySelector("#gEm");if(em)em.href=`mailto:${cfg.e}?subject=${encodeURIComponent("Feedback – "+cfg.n)}&body=${msg}`};
    if(gt){gt.oninput=upd;gn.oninput=upd}};
  root.onclick=e=>{const b=e.target.closest("[data-gstar]");if(b){state.rating=+b.dataset.gstar;paint()}};
  paint();
}
function testGuest(){
  const cfg=JSON.parse(JSON.stringify(qrCfgFor(qrLabels()[0])));
  const root=$("#guestRoot");
  root.innerHTML=`<div class="guestOverlay"><button class="btn ghost sm closeG" data-closeg>Close preview</button><div class="gHost"></div></div>`;
  root.querySelector("[data-closeg]").onclick=()=>{root.innerHTML=""};
  mountGuest(root,cfg);
}

/* ---------- Import ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function locKey(name){
  if(!name) return "oak";
  const n=name.toLowerCase();
  const hit=Object.entries(LOCS).find(([k,l])=>n.includes(l.name.toLowerCase())||l.name.toLowerCase().includes(n)||n.includes(k));
  if(hit) return hit[0];
  const k="loc-"+n.replace(/[^a-z0-9]+/g,"-").slice(0,24);
  if(!LOCS[k]) LOCS[k]={name,city:"",kind:"stay"};
  return k;
}
function importText(text){
  text=(text||"").trim(); if(!text){toast("Nothing to import");return}
  let recs=[];
  try{
    if(text[0]==="["||text[0]==="{"){const j=JSON.parse(text);recs=Array.isArray(j)?j:(j.reviews||[])}
    else{const rows=parseCSV(text);const head=rows[0].map(h=>h.trim().toLowerCase());const hasHead=head.includes("text")||head.includes("rating");
      const cols=hasHead?head:["source","listing","author","rating","date","title","text"];
      recs=(hasHead?rows.slice(1):rows).map(r=>Object.fromEntries(cols.map((c,i)=>[c,(r[i]||"").trim()])))}
  }catch(e){toast("Couldn't read that file");return}
  const imported=store.get("imported",[]);let added=0;
  recs.forEach((x,i)=>{
    const text=x.text||x.comment||x.review||x.body||"";const rating=Math.round(parseFloat(x.rating||x.stars||x.starRating||0));
    if(!text&&!rating) return;
    const srcRaw=String(x.source||x.platform||"google").toLowerCase();
    const r={id:"imp-"+Date.now().toString(36)+"-"+i,src:srcRaw.includes("trip")?"tripadvisor":"google",loc:locKey(x.listing||x.location||x.property||""),
      author:x.author||x.reviewer||x.name||"Guest",rating:Math.min(5,Math.max(1,rating||3)),date:(()=>{const dt=new Date(x.date||x.createTime||Date.now());return isNaN(dt)?new Date().toISOString():dt.toISOString()})(),
      title:x.title||"",text,status:"new",reply:"",draft:"",repliedAt:null};
    imported.push(r);reviews.push(r);added++;
  });
  store.set("imported",imported);
  toast(added?`Imported ${added} review${added>1?"s":""}`:"No reviews found in that data");
  if(added){st.view="inbox";st.status="todo";st.sel=null;render()}
}

/* ---------- Utils ---------- */
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg||"Reply copied – paste it on the review")}
  catch(e){const ta=$("#replyBox");if(ta){ta.focus();ta.select()}toast("Select-all is ready – copy with your keyboard or long-press")}
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- Boot ---------- */
const h=(window.__TREM_EMBED?(window.__TREM_HASH||""):location.hash).slice(1);
if(h.startsWith("fb-")){
  let cfg=null; try{cfg=JSON.parse(b32dec(h.slice(3)))}catch(e){}
  if(cfg&&cfg.n){
    document.body.classList.add("guestMode");document.title="How was your visit? · Tremcore";
    const root=$("#guestRoot");root.innerHTML=`<div class="gHost"></div>`;mountGuest(root,cfg);return;
  }
}
routeHash(h);
render();
})();
