<title>Tremcore Compliance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone-width app column, sticky header, scrolling screen, fixed bottom tab bar. Deliberate single dark theme: gold on black. */
:root{
  --ink:#070605; --track:#2a251e; --panel:#141210; --panel2:#1c1915; --line:#3a3125;
  --gold:#e9b949; --gold2:#c8922a; --goldsoft:rgba(233,185,73,.14);
  --text:#f3eee4; --mute:#a59c8c;
  --ok:#3fbf5a; --warn:#f2b51d; --bad:#e2433a; --info:#3d86e0;
  --display:"Cinzel",Georgia,serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;margin:0;
  background-image:radial-gradient(120% 60% at 100% 0%,rgba(200,146,42,.18),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(200,146,42,.12),transparent 60%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;border-inline:1px solid rgba(233,185,73,.12)}
.hdr{display:flex;align-items:center;gap:8px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hdr h1{flex:1;text-align:center;font-size:16px;font-weight:600;margin:0}
.hdr .back,.hdr .spacer{width:32px;height:32px;display:grid;place-items:center;color:var(--gold)}
.hdr .back svg{width:22px;height:22px}
.main{flex:1;overflow-y:auto;padding-block:4px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.brand svg.logo{width:76px;height:76px}
.wordmark{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:30px;line-height:1;
  background:linear-gradient(180deg,#ffe29a,#d9a23a 55%,#a8721c);-webkit-background-clip:text;background-clip:text;color:transparent}
.ltd{display:flex;align-items:center;gap:8px;font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.3em}
.ltd::before,.ltd::after{content:"";width:46px;height:1px;background:var(--gold2)}
.tag{font-style:italic;color:var(--gold);font-size:12.5px}
.logo-img{width:230px;height:auto;display:block;background:transparent}
.brand.sm .logo-img{width:170px}

/* cards & rows */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px}
.sec{font-size:16px;font-weight:600;margin:4px 0 0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px}
.row:hover{border-color:var(--gold2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:14px}
.row .t small{display:block;color:var(--mute);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.row .chev{color:var(--text);opacity:.8;width:18px;height:18px;flex:none}
.row .ico{width:22px;height:22px;color:var(--gold);flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;color:#111;font-size:16px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad);color:#fff}.dot.info{background:var(--info);color:#fff}
.dot svg{width:16px;height:16px}
.mini{width:18px;height:18px;font-size:11px}
.mini svg{width:11px;height:11px}

.btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;font-weight:600;color:#1a1204;
  background:linear-gradient(180deg,#f6d27a,#d9a23a);box-shadow:0 6px 20px rgba(217,162,58,.25)}
.btn-gold:active{transform:translateY(1px)}
.btn-line{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border-radius:10px;font-weight:600;color:var(--gold);border:1.5px solid var(--gold)}
.btn-gold svg,.btn-line svg{width:16px;height:16px}

/* ring */
.ring{position:relative;width:118px;height:118px;flex:none}
.ring .arc{position:absolute;inset:0;border-radius:50%;filter:drop-shadow(0 0 10px rgba(233,185,73,.18));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px))}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v strong{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .v span{font-size:10px;color:var(--mute);line-height:1.2}
.overview{display:flex;align-items:center;gap:18px}
.stats{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:8px;font-size:13px}
.stat em{font-style:normal;flex:1}
.stat .n{font-variant-numeric:tabular-nums;font-weight:600}

/* quick access */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:center}
.qa button:hover{border-color:var(--gold2)}
.qa svg{width:26px;height:26px;color:var(--gold)}
.qa b{font-weight:500;font-size:13px}.qa small{color:var(--mute);font-size:11px;margin-top:-4px}

/* add-ons */
.price.tbc{font-size:13px;color:var(--gold);letter-spacing:.02em}
.bundle{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--gold2);border-radius:12px;text-align:left;background:linear-gradient(100deg,rgba(233,185,73,.2),rgba(233,185,73,.05) 60%,var(--panel))}
.bundle:active{transform:scale(.99)}
.bundle .addon-ico{flex:none}
.bundle-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bundle-t b{font-size:14px;font-weight:700}
.bundle-t small{color:var(--mute);font-size:11px;line-height:1.35}
.bundle-p{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bundle-go{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px;color:#1a1204;background:linear-gradient(180deg,#f6d27a,#d9a23a);white-space:nowrap}
.bundle-go svg{width:12px;height:12px}
.main.embed-main{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0;padding-left:0;padding-right:0}
.embed-screen .lock-slot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock-slot:empty{display:none}
.embed-screen{flex:1;min-height:0;gap:10px;padding-bottom:0}
.embed-wrap{flex:1;min-height:0;position:relative;border-top:1px solid var(--line);overflow:hidden;background:#060606}
.embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#060606}
.embed-load{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--mute);font-size:13px}
.embed-load .btn-line{margin-top:10px}
.guest-full{position:fixed;inset:0;z-index:50;background:#060606}
.guest-full iframe{width:100%;height:100%;border:0;display:block}
.addon-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.addons{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.addon{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--gold2);border-radius:12px;background:linear-gradient(180deg,rgba(233,185,73,.07),var(--panel))}
.addon{position:relative}
.info-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font:italic 700 13px/1 Georgia,serif;display:grid;place-items:center;z-index:1}
.info-btn svg{width:11px;height:11px}
.info-btn:hover{background:var(--gold);color:#1a1204}
.addon-info{display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.ai-head{display:flex;align-items:center;gap:12px}
.ai-head .addon-ico{flex:none;width:48px;height:48px}
.ai-head div{flex:1;min-width:0}
.ai-head h2{margin:0;font-size:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 0}
.addon-info h3{margin:2px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.addon-info ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.addon-info li{display:flex;gap:10px;line-height:1.45;padding:9px 0;border-bottom:1px solid var(--line)}
.addon-info li:last-child{border:0}
.addon-info li svg{width:14px;height:14px;color:var(--ok);flex:none;margin-top:3px}
.addon.owned{border-style:solid;border-color:var(--line)}
.addon-main{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:4px 2px}
.addon-ico{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--goldsoft)}
.addon-ico>svg{width:24px;height:24px;color:var(--gold);opacity:.75}
.addon.owned .addon-ico>svg{opacity:1}
.lock{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:1.5px solid var(--gold);display:grid;place-items:center}
.lock svg{width:11px;height:11px;color:var(--gold)}
.addon b{font-weight:600;font-size:13px}
.addon small{color:var(--mute);font-size:11px;line-height:1.35}
.price{font-weight:700;color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
.price em{font-style:normal;font-weight:500;font-size:11px;color:var(--mute)}
.addon.owned .price{color:var(--ok);font-size:13px}
.buy{padding:9px;font-size:13px}.buy svg{width:13px;height:13px}
.lockbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--gold2);border-radius:12px;background:var(--goldsoft);font-size:12.5px}
.lockbar .lock{position:static;flex:none;width:26px;height:26px}
.lockbar .lock svg{width:13px;height:13px}
.lockbar p{flex:1;min-width:0;line-height:1.35}
.lockbar button{flex:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:#1a1204;background:linear-gradient(180deg,#f6d27a,#d9a23a)}

/* compliance item */
.clip{display:inline-flex;align-items:center;gap:2px;color:var(--gold)}
.clip svg{width:12px;height:12px}
.sh{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:13px;background:var(--ink)}
.st small{font-weight:400;font-size:11px;color:var(--mute)}
.st .sw{width:18px;height:18px;border-radius:50%}
.st-ok .sw{background:var(--ok)}.st-warn .sw{background:var(--warn)}.st-bad .sw{background:var(--bad)}
.st-ok[aria-checked="true"]{border-color:var(--ok);background:rgba(63,191,90,.12)}
.st-warn[aria-checked="true"]{border-color:var(--warn);background:rgba(242,181,29,.12)}
.st-bad[aria-checked="true"]{border-color:var(--bad);background:rgba(226,67,58,.12)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.doc img,.doc-ico{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.doc-ico{display:grid;place-items:center;background:var(--goldsoft)}.doc-ico svg{width:20px;height:20px;color:var(--gold)}
.doc .t{flex:1;min-width:0}.doc b{display:block;font-weight:500;font-size:13px;overflow-wrap:anywhere}.doc small{color:var(--mute);font-size:11.5px}
.mini-btn{flex:none;padding:6px 10px;border-radius:7px;border:1px solid var(--gold2);color:var(--gold);font-size:12px;font-weight:600}
.mini-btn svg{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.mini-btn.del{padding:6px;border-color:var(--line);color:var(--mute)}.mini-btn.del svg{width:12px;height:12px;display:block}
.upload{cursor:pointer;flex-direction:row;font-size:14px;color:var(--gold)}

/* toolbox talks */
.tgroup{display:flex;flex-direction:column}
.tgroup.open>.row{border-color:var(--gold2);border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(233,185,73,.10),var(--panel))}
.talk-list{display:flex;flex-direction:column;border:1px solid var(--gold2);border-top:0;border-radius:0 0 12px 12px;background:var(--ink);overflow:hidden;animation:in .2s ease}
.talk{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;text-align:left;width:100%;position:relative}
.talk+.talk::before{content:"";position:absolute;top:0;left:18px;right:14px;height:1px;background:var(--line)}
.talk:hover,.talk:focus-visible{background:var(--panel)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tt b{font-weight:500;font-size:15px;line-height:1.35;color:var(--text)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.tmeta>span{display:inline-flex;align-items:center;gap:5px}
.tmeta svg{width:13px;height:13px}
.tdone{color:var(--ok)}
.talk .chev{width:16px;height:16px;color:var(--gold);opacity:.8}
.tdoc{display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.tdoc-head{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--gold2)}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.eyebrow svg{width:15px;height:15px}
.tdoc h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tdoc p{font-size:14px;line-height:1.55}
.kp,.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5}
.kp li{display:flex;gap:10px}.kp svg{width:16px;height:16px;color:var(--gold);flex:none;margin-top:3px}
.qs li{padding:10px 12px;border-left:3px solid var(--gold);background:var(--goldsoft);border-radius:0 8px 8px 0;font-style:italic}
.reg{font-size:12px!important;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:999px;background:var(--goldsoft);border:1px solid var(--gold2);font-size:12.5px}
.chip button{display:grid;place-items:center;width:18px;height:18px;color:var(--mute)}.chip svg{width:10px;height:10px}
.tnav{display:flex;justify-content:space-between}

/* poster */
.poster-card{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--gold2);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.poster-card img{width:96px;height:auto;flex:none;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.5);background:#fff}
.pc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pc-body h3{margin:0;font-size:15px}.pc-body p{font-size:12.5px;line-height:1.4}
.pc-btns{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pc-btns button{padding:9px;font-size:13px}

/* core / other */
.cbtns{display:flex;flex-direction:column;gap:8px}
.cnt{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.18)}
.btn-line .cnt{background:var(--goldsoft)}
.grp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.grp span{flex:1;min-width:0}.grp b{display:block;font-size:13.5px;font-weight:600}.grp small{color:var(--mute);font-size:11.5px}

/* help */
.search{display:flex;align-items:center;gap:10px;flex-direction:row;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.search svg{width:18px;height:18px;color:var(--gold);flex:none}
.search input{border:0;background:none;padding:12px 0;font-size:14px}
.search input:focus-visible{outline:none}.search:focus-within{border-color:var(--gold2)}
.faqwrap{display:flex;flex-direction:column;gap:8px}
.faq{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.faq details+details{border-top:1px solid var(--line)}
.faq summary{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;list-style:none;font-size:14px;font-weight:500;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1;min-width:0}
.faq summary .chev{width:16px;height:16px;color:var(--gold);transition:transform .2s;flex:none}
.faq details[open] summary .chev{transform:rotate(90deg)}
.faq details[open] summary{color:var(--gold)}
.faq p{padding:0 14px 14px;font-size:13.5px;line-height:1.55;color:var(--text);opacity:.9}
.still{display:flex;flex-direction:column;gap:8px;border-color:var(--gold2);margin-top:6px}
.still h3{margin:0;font-size:16px}.still p{font-size:13px}
textarea{background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px;font:inherit;width:100%;resize:vertical}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:4px auto 0}
.done-ic svg{width:28px;height:28px;color:#fff}

/* staff clock */
.live{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ok);font-variant-numeric:tabular-nums;text-align:center}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(63,191,90,.6);animation:pulse 2s infinite;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(63,191,90,0)}100%{box-shadow:0 0 0 0 rgba(63,191,90,0)}}
#qr.flash{animation:qrflash .9s ease}
@keyframes qrflash{0%{box-shadow:0 0 0 0 rgba(233,185,73,.9)}100%{box-shadow:0 0 0 18px rgba(233,185,73,0)}}
@media (prefers-reduced-motion:reduce){.pulse,#qr.flash{animation:none}}
.staff-sec{display:flex;flex-direction:column;gap:10px}
.staff-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.staff-head small{font-size:12px}
.staff-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.staff-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.staff-row+.staff-row{border-top:1px solid var(--line)}
.staff-row:hover{background:var(--panel2)}
.staff-row .t{flex:1;min-width:0}.staff-row .t b{display:block;font-weight:500;font-size:14.5px}.staff-row .t small{color:var(--mute);font-size:12px}
.sr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sr-right small{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:#1a1204;background:linear-gradient(180deg,#f6d27a,#d9a23a)}
.av.lg{width:48px;height:48px;font-size:16px}
.pill.off{background:rgba(165,156,140,.14);color:var(--mute)}
.ts-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ts-week{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.ts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.ts-row{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:start;padding:10px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.ts-row+.ts-row{border-top:1px solid var(--line)}
.ts-day{color:var(--mute)}.ts-tot{font-weight:600}
.sheet.scan{max-height:92%}
.scan-top{display:flex;justify-content:space-between;align-items:center}
.scan-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.scan-tag svg{width:14px;height:14px}
.scan-brand{display:flex;flex-direction:column;align-items:center;gap:2px}
.scan-brand img{width:120px}.scan-brand small{color:var(--mute);font-size:12px}
.scan-names{display:grid;grid-template-columns:1fr;gap:8px}
.scan-names button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:16px;font-weight:500;text-align:left}
.scan-names button:hover{border-color:var(--gold)}
.scan-dir{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-dir.one{grid-template-columns:1fr}
.scan-dir.one button{padding:28px 8px;font-size:19px}
.scan-dir button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 8px;border-radius:14px;font-size:17px;font-weight:700;border:2px solid var(--line);background:var(--panel2)}
.scan-dir svg{width:26px;height:26px}
.scan-dir .in{color:var(--ok)}.scan-dir .out{color:var(--gold)}
.scan-dir .in.sug{border-color:var(--ok);background:rgba(63,191,90,.12)}
.scan-dir .out.sug{border-color:var(--gold);background:var(--goldsoft)}

/* fitness declaration */
.decl{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--gold2);border-radius:12px;background:var(--ink);font-size:13.5px;line-height:1.55}
.decl-head{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.decl-head h2{margin:0;font-family:var(--display);font-size:19px;line-height:1.25}
.decl-head p{font-size:12.5px}
.decl-ref{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold2);border-radius:5px;padding:2px 6px}
.decl ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.decl ol li::marker{color:var(--gold);font-weight:700}
.decl-law{font-size:12px!important;color:var(--mute);padding:10px 12px;border-left:3px solid var(--gold2);background:var(--panel)}
.decl-check{flex-direction:row!important;align-items:flex-start;gap:10px!important;font-size:13.5px!important;color:var(--text)!important;padding:12px;border-radius:10px;background:var(--goldsoft);cursor:pointer}
.decl-check input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--gold)}
#dgo:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-line.decline{color:var(--bad);border-color:var(--bad)}
.pill.flag{background:rgba(226,67,58,.16);color:var(--bad)}
.decl-note{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ok);margin-top:2px}
.decl-note.bad{color:var(--bad)}.decl-note svg{width:11px;height:11px}
.flagcard{display:flex;gap:10px;align-items:flex-start;border-color:var(--bad);padding:12px}
.flagcard svg{width:20px;height:20px;color:var(--bad);flex:none}.flagcard p{font-size:13px}

/* hours */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pnav b{flex:1;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pnav button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--gold)}
.pnav button:hover:not(:disabled){background:var(--goldsoft)}
.pnav button:disabled{opacity:.3;cursor:default}
.pnav svg{width:18px;height:18px}
.hp{display:flex;flex-direction:column;gap:10px}
.hp-sum{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--gold2)}
.hp-sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold)}
.hp-sum small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.hp-total{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border-color:var(--gold2)}
.hp-total b{font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.hp-total span{font-size:12.5px;font-variant-numeric:tabular-nums}
.miss-note{display:flex;align-items:center;gap:6px;font-size:12px!important;color:var(--warn)}
.miss-note svg{width:14px;height:14px;flex:none}
.miss{color:var(--warn)}
.hrs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.hrs-item+.hrs-item{border-top:1px solid var(--line)}
.hrs-row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.hrs-row:hover{background:var(--panel2)}
.hrs-row .t{flex:1;min-width:0}.hrs-row .t b{display:block;font-weight:500;font-size:14.5px}.hrs-row .t small{color:var(--mute);font-size:12px}
.hrs-tot{display:flex;flex-direction:column;align-items:flex-end;flex:none;font-variant-numeric:tabular-nums}
.hrs-tot b{font-size:15px}.hrs-tot small{color:var(--mute);font-size:11.5px}
.hrs-row .chev{width:16px;height:16px;color:var(--gold);transition:transform .2s;flex:none}
.hrs-item.open .chev{transform:rotate(90deg)}
.hrs-item.open .hrs-row{background:var(--panel2)}
.ts.in-hrs{margin:0 12px 12px;border-radius:10px}

/* rota + variance */
.wtag{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.rota-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rota-sum span{padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:11.5px;color:var(--mute)}
.rota-sum b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.rota-tools{display:flex;gap:8px;justify-content:flex-end}
.del-text{color:var(--bad)!important;border-color:var(--line)!important}
.rota-days{display:flex;flex-direction:column;gap:10px}
.rday{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.rday.today{border-color:var(--gold2)}.rday.past{opacity:.6}
.rday header{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.rday header b{font-size:14px}.rday header small{flex:1;color:var(--mute);font-size:12px}
.rday header .mini-btn{align-self:center}
.rshift{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left}
.rshift+.rshift{border-top:1px solid var(--line)}.rshift:hover{background:var(--panel2)}
.rshift .t{flex:1;min-width:0}.rshift .t b{display:block;font-weight:500;font-size:14px}.rshift .t small{color:var(--mute);font-size:11.5px}
.rtime{display:flex;flex-direction:column;align-items:flex-end;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.rtime small{font-weight:400;color:var(--mute);font-size:11px}
.rempty{padding:10px 12px;font-size:12.5px;color:var(--mute)}
.av.sm{width:30px;height:30px;font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .mini-btn{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.tiles>div{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);text-align:left}
.tiles small{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tiles b{font-size:19px;font-variant-numeric:tabular-nums}
.tiles em{font-style:normal;font-size:11px;color:var(--mute)}
.tiles .g{border-color:rgba(63,191,90,.45);background:rgba(63,191,90,.08)}.tiles .g b{color:var(--ok)}
.tiles .r{border-color:rgba(226,67,58,.45);background:rgba(226,67,58,.08)}.tiles .r b{color:var(--bad)}
.hp-total{align-items:stretch}
.hrs-tot .gr{display:flex;gap:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.gr i{font-style:normal}.gr .g{color:var(--ok)}.gr .r{color:var(--bad)}
.setline{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.vchip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.vchip.green{background:rgba(63,191,90,.16);color:var(--ok)}
.vchip.red{background:rgba(226,67,58,.16);color:var(--bad)}
.vchip.mute-chip{background:rgba(165,156,140,.14);color:var(--mute)}

/* bespoke talks */
.bespoke{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed var(--gold2);border-radius:14px;background:linear-gradient(180deg,rgba(233,185,73,.08),var(--panel))}
.bs-head{display:flex;align-items:center;gap:12px}
.bs-head .addon-ico{flex:none}
.bs-head h3{margin:0;font-size:15px}
.bespoke p{font-size:13px;line-height:1.5}
.bs-price,.bs-total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--gold2)}
.bs-price span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold)}.bs-price svg{width:13px;height:13px}
.bs-price b,.bs-total b{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.bs-total span{font-size:14px}
.req{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-left:4px}
.bs-wait{color:var(--warn)}
.bs-notice{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--goldsoft);font-size:12.5px!important;color:var(--text)}
.bs-notice svg{width:16px;height:16px;color:var(--gold);flex:none}
.bs-notice b{color:var(--gold)}

/* emergency numbers */
.ecall{display:flex;flex-direction:column;gap:8px}
.ec{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid}
.ec .num{flex:none;font-size:26px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:center}
.ec p{font-size:12.5px;line-height:1.45;color:var(--text)}
.ec b{display:block;font-size:14px;margin-bottom:1px}
.ec-999{border-color:var(--bad);background:rgba(226,67,58,.10)}.ec-999 .num,.ec-999 b{color:var(--bad)}
.ec-111{border-color:var(--info);background:rgba(61,134,224,.10)}.ec-111 .num,.ec-111 b{color:#6aa6ee}

/* subscription terms */
.terms{padding:12px 14px;border:1px solid var(--gold2);border-radius:12px;background:var(--ink)}
.terms h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.terms ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5}
.terms li::marker{color:var(--gold)}
#subgo:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}

/* payment plans */
.plans{display:flex;flex-direction:column;gap:8px}
.plan{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--ink);text-align:left;width:100%}
.plan[aria-checked="true"]{border-color:var(--gold);background:var(--goldsoft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.plan[aria-checked="true"] .radio{border-color:var(--gold)}
.plan[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pl-t{flex:1;min-width:0}.pl-t b{display:block;font-size:14px}.pl-t small{color:var(--mute);font-size:11.5px}
.pl-p{flex:none;font-weight:700;color:var(--gold);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.pl-p em{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--mute)}
.save{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--ok);color:#06210d;vertical-align:1px;margin-left:4px}
.upfront{font-size:10.5px;color:var(--ok);line-height:1.3}

/* auto colour + AI scan */
.renew{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.renew>div{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ink)}
.renew small{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.renew b{font-size:14.5px;font-variant-numeric:tabular-nums}.renew em{font-style:normal;font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
.valid{padding:10px 12px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--gold2)}
.valid b{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--gold)}.valid b svg{width:15px;height:15px}
.valid p{font-size:12.5px;line-height:1.45;margin-top:4px}
.stgrid.locked .st{cursor:default;opacity:.45}
.stgrid.locked .st[aria-checked="true"]{opacity:1}
.lock-note{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);margin-top:6px}
.lock-note svg{width:12px;height:12px;flex:none;color:var(--gold)}
svg.inl{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--gold)}
.scan-res{display:flex!important;align-items:flex-start;gap:4px;color:var(--ok)!important;margin-top:3px}
.scan-res.warn{color:var(--warn)!important}.scan-res svg{width:11px;height:11px;flex:none;margin-top:2px}
.scanning,.scan-done,.scan-fail{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--gold2);background:var(--ink)}
.scanning b,.scan-done b{display:block;font-size:13.5px}.scanning small,.scan-done small{display:block;font-size:12px;color:var(--mute);line-height:1.45;margin-top:2px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--goldsoft);border-top-color:var(--gold);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-done .sw{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px}
.scan-done.st-ok{border-color:var(--ok)}.scan-done.st-warn{border-color:var(--warn)}.scan-done.st-bad{border-color:var(--bad)}
.warn-t{display:flex!important;gap:4px;color:var(--warn)!important}.warn-t svg{width:12px;height:12px;flex:none;margin-top:2px}
.scan-fail{flex-direction:column;gap:8px;border-color:var(--warn)}
.scan-fail b{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--warn)}.scan-fail b svg{width:15px;height:15px}
.scan-fail small{font-size:12px;color:var(--mute)}
.btn-gold.upload{cursor:pointer;flex-direction:row;color:#1a1204;font-size:14px}

/* calendar picker */
.pnav .pcal{flex:1;width:auto;height:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--text)}
.pnav .pcal b{flex:none}
.pnav .pcal svg{width:16px;height:16px;color:var(--gold)}
.pnav .pcal:hover{background:var(--goldsoft)}
.cal{border:1px solid var(--line);border-radius:12px;background:var(--ink);padding:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:15px}
.cal-head button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--gold)}
.cal-head button:disabled{opacity:.3}.cal-head svg{width:18px;height:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cal-grid span{text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.cal-grid button{height:38px;font-size:14px;font-variant-numeric:tabular-nums;border-radius:0}
.cal-grid button.out{color:var(--mute);opacity:.55}
.cal-grid button:disabled{opacity:.2;cursor:default}
.cal-grid button.now{font-weight:700;color:var(--gold)}
.cal-grid button.inr{background:var(--goldsoft)}
.cal-grid button.rs{border-radius:19px 0 0 19px}.cal-grid button.re{border-radius:0 19px 19px 0}.cal-grid button.rs.re{border-radius:19px}
.cal-grid button.rs,.cal-grid button.re{background:linear-gradient(180deg,#f6d27a,#d9a23a);color:#1a1204;font-weight:700;opacity:1}
.cal-months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal-months button{padding:14px 0;border-radius:10px;border:1px solid var(--line);font-size:14px}
.cal-months button.now{color:var(--gold);font-weight:700}
.cal-months button.sel{background:linear-gradient(180deg,#f6d27a,#d9a23a);color:#1a1204;font-weight:700;border-color:transparent}
.cal-months button:disabled{opacity:.25;cursor:default}
.cal-sel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--goldsoft);border:1px solid var(--gold2)}
.cal-sel small{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.cal-sel b{font-variant-numeric:tabular-nums;text-align:right}

/* task calendar */
.vtoggle{display:flex;gap:6px;justify-content:flex-end}
.vtoggle button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.vtoggle button svg{width:14px;height:14px}
.vtoggle button[aria-selected="true"]{border-color:var(--gold);color:var(--gold);background:var(--goldsoft);font-weight:600}
.tgrid button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px}
.tgrid button.pick{background:var(--goldsoft);outline:1.5px solid var(--gold);outline-offset:-1.5px}
.tdots{display:flex;gap:3px;height:6px}
.tdots em,.tlegend em{width:6px;height:6px;border-radius:50%;display:inline-block}
.td-bad{background:var(--bad)}.td-warn{background:var(--warn)}.td-info{background:var(--info)}.td-ok{background:var(--ok)}
.tlegend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--mute)}
.tlegend span{display:flex;align-items:center;gap:5px}
.tday-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* task form (iPhone style) */
.tf-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tf-top h2{margin:0;font-size:17px}
.tf-top .add{background:linear-gradient(180deg,#f6d27a,#d9a23a);color:#1a1204;border-color:transparent}
.tf-group{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--ink);overflow:hidden}
.tf-group>*+*{border-top:1px solid var(--line)}
.tf-group>[hidden]+*{border-top:1px solid var(--line)}
.tf-in{border:0!important;border-radius:0!important;background:none!important;padding:13px 14px!important;font-size:15px!important}
.tf-in:focus-visible{outline:none;background:var(--panel)!important}
textarea.tf-in{resize:vertical}
.tf-row{display:flex!important;flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px!important;padding:6px 14px;min-height:48px;font-size:15px!important;color:var(--text)!important}
.tf-row>span:first-child{flex:none}
.tf-row select,.tf-row input[type=date],.tf-row input[type=time]{width:auto;max-width:62%;border:0;background:none;color:var(--gold);text-align:right;padding:8px 0;font-size:15px}
.tf-pair{display:flex;gap:8px;align-items:center}
.tf-pair input{width:64px;text-align:center;padding:8px}
.tf-pair select{max-width:none;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
.tf-row[hidden]{display:none!important}
/* iPhone Safari: stop rows and inputs being squashed inside scrolling panels */
.sheet>*,.tf-group>*,.list>*,.screen>*,.docs>*,.ts>*{flex-shrink:0}
.tf-in{min-height:48px;-webkit-appearance:none;appearance:none}
textarea.tf-in{min-height:84px}
.tf-row{flex-shrink:0}
.tf-row input[type=date],.tf-row input[type=time]{-webkit-appearance:none;appearance:none;min-height:36px;min-width:7.5em;display:flex;justify-content:flex-end}

let rota = store.get('rota', []);
function saveRota(){ store.set('rota', rota); }
const planFor = (sid, day) => rota.find(r=>r.sid===sid && r.date===day);
const tmin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const planMs = p => (tmin(p.end)-tmin(p.start))*60000;
const mins = m => { m=Math.round(Math.abs(m)); return m<60? m+'m' : Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; };
/* compare a planned shift with the actual clock in / out for that day */
function variance(sid, day){
  const p=planFor(sid,day); if(!p) return null;
  const e=dayEntries(sid,day), firstIn=e.find(c=>c.dir==='in'), outs=e.filter(c=>c.dir==='out'), lastOut=outs[outs.length-1];
  const ps=new Date(day+'T'+p.start), pe=new Date(day+'T'+p.end), now=new Date(), today=dstr(now);
  const v={plan:p, setMs:planMs(p), inDiff:null, outDiff:null, missed:false, pending:false};
  if(!firstIn){ if(day<today || (day===today && now>pe)) v.missed=true; else v.pending=true; return v; }
  v.inDiff=Math.round((ps-new Date(firstIn.t))/60000);            // + early (green), - late (red)
  if(lastOut && new Date(lastOut.t)>new Date(firstIn.t)) v.outDiff=Math.round((new Date(lastOut.t)-pe)/60000);  // + stayed late (green), - left early (red)
  return v;
}
function varChips(v){
  if(!v) return `<span class="vchip mute-chip">No set shift</span>`;
  if(v.missed) return `<span class="vchip red">Missed shift · ${mins(v.setMs/60000)}</span>`;
  if(v.pending) return `<span class="vchip mute-chip">Not started yet</span>`;
  const c=[];
  if(v.inDiff!==null && v.inDiff!==0) c.push(v.inDiff>0?`<span class="vchip green">In ${mins(v.inDiff)} early</span>`:`<span class="vchip red">In ${mins(v.inDiff)} late</span>`);
  if(v.inDiff===0) c.push(`<span class="vchip mute-chip">In on time</span>`);
  if(v.outDiff!==null && v.outDiff!==0) c.push(v.outDiff>0?`<span class="vchip green">Out ${mins(v.outDiff)} late</span>`:`<span class="vchip red">Out ${mins(v.outDiff)} early</span>`);
  if(v.outDiff===0) c.push(`<span class="vchip mute-chip">Out on time</span>`);
  return c.join('');
}
function periodTotals(sid, days){
  const today=dstr(new Date()); let ms=0, worked=0, missing=0, live=false, setMs=0, green=0, red=0, missed=0;
  days.forEach(d=>{
    const v=variance(sid,d);
    if(v){ setMs+=v.setMs;
      if(v.missed){ red+=v.setMs/60000; missed++; }
      else { if(v.inDiff!==null){ if(v.inDiff>0) green+=v.inDiff; else red+=-v.inDiff; }
             if(v.outDiff!==null){ if(v.outDiff>0) green+=v.outDiff; else red+=-v.outDiff; } } }
    const sh=shifts(sid,d); if(!sh.length) return; worked++; ms+=workedMs(sid,d);
    sh.forEach(x=>{ if(!x.in || (!x.out && d!==today)) missing++; if(x.in && !x.out && d===today) live=true; });
  });
  return {ms, worked, missing, live, setMs, green, red, missed};
}
function dayRows(sid, days){
  const today=dstr(new Date()), yest=dstr(new Date(Date.now()-864e5));
  return days.slice().reverse().map(day=>{ const sh=shifts(sid,day), v=variance(sid,day); if(!sh.length && !(v&&v.missed)) return '';
    const label = day===today?'Today':day===yest?'Yesterday':new Date(day+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="ts-row"><span class="ts-day">${label}</span><span class="ts-times">${sh.length?sh.map(x=>`${x.in?hhmm(x.in):'<span class="miss">no in</span>'} – ${x.out?hhmm(x.out):(day===today?'now':'<span class="miss">no out</span>')}`).join('<br>'):'<span class="miss" style="color:var(--bad)">Did not clock in</span>'}
      ${v?`<small class="setline">Set ${v.plan.start} – ${v.plan.end}</small>`:''}<span class="vchips">${varChips(v)}</span></span><b class="ts-tot">${sh.length?dur(workedMs(sid,day)):'—'}</b></div>`; }).join('');
}
function sumTiles(t){
  return `<div class="tiles">
    <div><small>Set hours</small><b>${dur(t.setMs)}</b></div>
    <div><small>Worked</small><b>${dur(t.ms)}</b><em>${decH(t.ms)}</em></div>
    <div class="g"><small>Green</small><b>+${mins(t.green)}</b><em>early in / late out</em></div>
    <div class="r"><small>Red</small><b>−${mins(t.red)}</b><em>late in / early out${t.missed?` · ${t.missed} missed`:''}</em></div>
  </div>`;
}

  {g:'Add-ons', q:'How do I cancel an add-on?', a:'Add-ons are on a 12-month rolling contract. To cancel, go to Settings, then Subscription Details, tap the add-on and send a cancellation request. It must reach us at least 30 days before your renewal date, otherwise the add-on renews for a further 12 months. The add-on stays active until the renewal date.'},
  {g:'Toolbox Talks', q:'How do I record that a talk was delivered?', a:'Open the talk, scroll to Delivery record, enter who delivered it, add each attendee, then tap Mark as Delivered. The talk then shows the delivery date in the list.'},
  {g:'Toolbox Talks', q:'Can I get a talk written for my business?', a:'Yes. On Toolbox Talks, tap Request a Bespoke Talk. Each one costs £1.99. Give as much detail as you can, such as the subject, the task, the hazards and who will attend. Please allow up to 48 hours to receive it. It is added to your Toolbox Talks for the rest of your subscription and stays when you renew.'},
  {g:'Staff Clock In / Out', q:'How do staff clock in and out?', a:'Display the QR poster at your entrance. Staff scan it with their phone camera, tap their name, then tap Clock In or Clock Out. Tap See What Staff See on the Staff Clock In screen to try it yourself.'},
  {g:'Staff Clock In / Out', q:'How do I add, edit or remove staff?', a:'Go to Staff Clock In and tap Add Staff. To change someone, tap their name, then Edit or Remove from QR Code. The QR code updates straight away, so there is no need to reprint the poster.'},
  {g:'Staff Clock In / Out', q:'How do I see a staff member\'s hours?', a:'Go to Staff Clock In and tap their name. You will see whether they are on site, their times for the last 7 days and their total hours. You can also clock them in or out from there.'},
  {g:'Staff Clock In / Out', q:'How do I print the QR poster?', a:'Go to Staff Clock In and tap Download PDF or Print under Printable QR Poster. Print on A4 at 100% scale so the code scans reliably.'},
  {g:'Staff Clock In / Out', q:'Where can I see who is on site?', a:'Go to Staff Clock In. Each staff member shows In since a time or Off site. Tap Today\'s Clock Log to see every clock in and out today.'},
  {g:'Staff Clock In / Out', q:'How do I set shifts for next week?', a:'Go to Staff Clock In and tap Shift Rota. It opens on next week. Tap Add on a day, pick the staff member and their start and finish times, and tick the box to repeat it Monday to Friday. Copy last week fills the week from the one before.'},
  {g:'Staff Clock In / Out', q:'What do the green and red times mean?', a:'Green is extra time: clocking in before the set start or out after the set finish. Red is lost time: clocking in late, leaving early, or missing a set shift. The Staff Hours Report shows set hours, worked hours, total green and total red for any day, week, 2 weeks or month.'},
  {g:'Emergency', q:'How do I update the assembly point, fire marshal or first aider?', a:'Go to Emergency Information from the Home screen and tap Edit on the box you want to change, then tap Save.'}
];
function renderHelpList(){ const pos=$('#hq').selectionStart; render(); const el=$('#hq'); el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
function reportIssue(){
  sheet(`<div class="grab"></div><h2>Report an Issue</h2>
  <label for="ri-t">What is it about?<select id="ri-t"><option>Compliance</option><option>Documents or photos</option><option>Tasks</option><option>Toolbox Talks</option><option>Staff Clock In / Out</option><option>Reviews</option><option>Poster Generator</option><option>Billing or add-ons</option><option>Something else</option></select></label>
  <label for="ri-d">Describe the problem<textarea id="ri-d" rows="4" placeholder="What were you trying to do, and what happened?"></textarea></label>
  <label for="ri-n">Your name<input id="ri-n" placeholder="e.g. Lee Tremain" autocomplete="name"></label>
  <label for="ri-c">Best phone number or email<input id="ri-c" placeholder="So we can contact you" autocomplete="email"></label>
  <button class="btn-gold" onclick="sendIssue()">Send Report</button><button class="btn-line" onclick="closeSheet()">Cancel</button>`);
}
function sendIssue(){
  const d=$('#ri-d').value.trim(), n=$('#ri-n').value.trim(), c=$('#ri-c').value.trim();
  if(!d){ $('#ri-d').focus(); toast('Describe the problem to send the report'); return; }
  if(!n){ $('#ri-n').focus(); toast('Add your name'); return; }
  if(!c){ $('#ri-c').focus(); toast('Add a phone number or email so we can contact you'); return; }
  const ref='TRM-'+Math.floor(10000+Math.random()*89999);
  sheet(`<div class="done-ic">${ic('check')}</div><h2 class="center">Report received</h2>
  <p class="center">Thanks, ${esc(n)}. Someone from the Tremcore team will contact you on <b>${esc(c)}</b> within 48 hours.</p>
  <p class="center mute" style="font-size:12.5px">Your reference is <b class="gold">${ref}</b>.</p>
  <p class="center mute" style="font-size:11.5px">Preview: reports aren't sent anywhere yet.</p>
  <button class="btn-gold" onclick="closeSheet()">Done</button>`);
}
function confirmBuy(k){ if(!$('#tc')||!$('#tc').checked){ toast('Tick the box to accept the subscription terms'); return; } const st=new Date().toISOString(); if(k==='all') BUNDLE.keys.forEach(x=>owned[x]={start:st, cancel:null, plan:BUYPLAN, bundle:true}); else owned[k]={start:st, cancel:null, plan:BUYPLAN}; closeSheet(); render(); toast(getA(k).name+' unlocked (demo, no payment taken)'); }

/* ---------- navigation ---------- */
let stack = ['home'];
let state = {compTab:'overview', taskTab:'pending', talkOpen:null};
const tabOf = {home:'home', compliance:'compliance', tasks:'tasks', talks:'tasks', talk:'tasks', help:'settings', hours:'home', rota:'home', clock:'home', settings:'settings', emergency:'home', reviews:'home', posters:'home'};
const titles = {compliance:'Compliance', tasks:'My Tasks', talks:'Toolbox Talks', talk:'Toolbox Talk', help:'Help & Support', hours:'Staff Hours', rota:'Shift Rota', clock:'Staff Clock In', settings:'Settings', emergency:'Emergency Information', reviews:'Reviews', posters:'Poster Generator'};
function fadeNav(fn){ const sc=document.querySelector('.screen'); if(!sc || matchMedia('(prefers-reduced-motion: reduce)').matches) return fn(); sc.classList.add('leaving'); setTimeout(fn,190); }
function go(s, push=true){ fadeNav(()=>{ if(push && stack[stack.length-1]!==s) stack.push(s); render(); $('#main').scrollTop=0; }); }
function back(){ fadeNav(()=>{ if(stack.length>1) stack.pop(); else stack=['home']; render(); }); }
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; fadeNav(()=>{ stack=[b.dataset.tab]; render(); $('#main').scrollTop=0; }); });

function render(){
  refreshStatuses();
  const s = stack[stack.length-1];
  const hdr = $('#hdr');
  if(s==='home'){ hdr.hidden=true; }
  else { hdr.hidden=false; hdr.innerHTML = `<button class="back" aria-label="Back" onclick="back()">${ic('back')}</button><h1>${titles[s]}</h1><span class="spacer"></span>`; }
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tabOf[s]));
  const emb = s==='reviews'||s==='posters', M=$('#main');
  /* keep a loaded add-on running when only its lock bar changes (e.g. after a pop-up closes) */
  if(emb && M.dataset.emb===s && M.querySelector('.embed-wrap iframe') && !M.querySelector('.screen.leaving')){ M.querySelector('.lock-slot').innerHTML=lockBanner(s); return; }
  M.dataset.emb = emb?s:'';
  M.classList.toggle('embed-main', emb);
  $('#main').innerHTML = `<div class="screen${emb?' embed-screen':''}">${screens[s]()}</div>`;
  if(s==='clock') drawQR();
  if(emb) mountEmbed(s, $('#emb-'+s));
}

function ring(sub){
  const n=counts(), segs=[['ok',n.ok],['warn',n.warn],['bad',n.bad]].filter(x=>x[1]>0);
  const col={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)'}, B=3;
  let stops=[], at=0;
  segs.forEach(([k,v],i)=>{
    const w=v/n.total*100, start=at, end=at+w;
    const s0 = i===0 ? start : Math.min(start+B, start+w/2);
    const e0 = i===segs.length-1 ? end : Math.max(end-B, end-w/2);
    stops.push(`${col[k]} ${s0.toFixed(2)}%`, `${col[k]} ${e0.toFixed(2)}%`); at=end;
  });
  const bg = segs.length ? `conic-gradient(from 0deg, ${stops.join(', ')})` : 'var(--track)';
  return `<div class="ring" role="img" aria-label="${n.pct}% compliant: ${n.ok} green, ${n.warn} amber, ${n.bad} red"><div class="arc" style="background:${bg}"></div>
    <div class="v"><strong>${n.pct}%</strong>${sub?`<span>Core<br>Compliance</span>`:''}</div></div>`;
}

/* key: when the same panel is redrawn (e.g. opening a dropdown inside it), keep its scroll position and skip the slide-in */
function sheet(html, variant, key){
  const prev=document.querySelector('.sheet'), same=key && prev && prev.dataset.key===key, top=same?prev.scrollTop:0;
  /* every pop-up gets a close (x) button in its top right */
  const X=`<button class="x-close" aria-label="Close" onclick="closeSheet(true);render()">${ic('x')}</button>`;
  let hasx=html.includes('x-close');
  if(!hasx && html.includes('<span style="width:56px"></span>')){ html=html.replace('<span style="width:56px"></span>',X); hasx=true; }
  const inject = !hasx && !html.includes('class="tf-top"') && !html.includes('class="scan-top"');
  closeSheet(); const bg=document.createElement('div'); bg.className='sheet-bg'+(same?' still':''); bg.innerHTML=`<div class="sheet ${variant||''} ${inject?'hasx':''}" role="dialog" data-key="${key||''}">${inject?`<div class="sheet-x">${X}</div>`:''}${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSheet(true); }); $('#app').append(bg);
  if(same){ bg.firstElementChild.scrollTop=top; return; }
  const f=bg.querySelector('input:not([type=file]):not([type=checkbox])'); if(f) f.focus({preventScroll:true});
}
function closeSheet(animate){
  document.querySelectorAll('.sheet-bg').forEach(x=>{
    if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){ x.classList.add('closing'); x.style.pointerEvents='none'; setTimeout(()=>x.remove(),340); }

}

/* ---------- validity periods (UK guidance; see "basis" for each) ---------- */
const VALIDITY = {
  c1:{m:12, basis:'No fixed legal period. Review at least every 12 months, and sooner after changes to the building, work or people (Regulatory Reform (Fire Safety) Order 2005).'},
  c2:{m:6,  basis:'Inspection and servicing by a competent person at intervals not exceeding 6 months (BS 5839-1). Weekly user test of a call point.'},
  c3:{m:12, basis:'Basic service every 12 months, extended service every 5 years, CO2 overhaul every 10 years (BS 5306-3). Monthly visual check.'},
  c4:{m:12, basis:'Full-duration (3-hour) test every 12 months (BS 5266-1). Monthly flick test.'},
  c5:{m:60, basis:'Commercial premises such as offices and shops every 5 years, industrial units every 3 years (BS 7671 / IET Guidance Note 3), or sooner if the report says so.'},
  c6:{m:12, basis:'No fixed legal period. Interval depends on equipment and environment (IET Code of Practice). 12 months is a common default; office IT can be longer, construction sites much shorter.'},
  c7:{m:12, basis:'A management survey has no expiry date, but the asbestos register and management plan should be reviewed at least every 12 months (Control of Asbestos Regulations 2012).'},
  c8:{m:24, basis:'No fixed legal period. Review at least every 2 years, and sooner after changes to the water system or use of the building (HSE ACOP L8 / BS 8580-1).'},
  c9:{m:12, basis:'Annual safety check and service by a Gas Safe registered engineer (Gas Safety (Installation and Use) Regulations 1998).'},
  c10:{m:12,basis:'Leak checks every 12 months for 5–50 tonnes CO2e, every 6 months for 50–500 tonnes, every 3 months over 500 tonnes. A leak detection system doubles the interval (F-Gas Regulation).'},
  c11:{m:12,basis:'No fixed legal period. Review at least every 12 months or when substances or processes change (COSHH Regulations 2002).'},
  c12:{m:12,basis:'Policies renew every 12 months (Employers\' Liability (Compulsory Insurance) Act 1969).'},
  c13:{m:1, basis:'No fixed legal period. Check contents monthly and after each use (Health and Safety (First-Aid) Regulations 1981).'}
};
const validityOf = c => VALIDITY[c.id] || {m:c.months||12, basis:'Validity period set when this item was added.'};
const addM = (iso,n) => { const d=new Date(iso+'T12:00'); const day=d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()!==day) d.setDate(0); return dstr(d); };

/* ---------- tasks: iPhone-style events with repeat, end repeat and alerts ---------- */
const REPEATS=[['none','Never'],['day','Every Day'],['weekday','Every Weekday (Mon–Fri)'],['week','Every Week'],['2week','Every 2 Weeks'],['month','Every Month'],['quarter','Every 3 Months'],['6month','Every 6 Months'],['year','Every Year'],['custom','Custom…']];
const ALERTS=[['none','None'],['0','At time of task'],['15','15 minutes before'],['30','30 minutes before'],['60','1 hour before'],['120','2 hours before'],['1440','1 day before'],['2880','2 days before'],['10080','1 week before'],['43200','1 month before']];
const repLabel = r => { if(!r||r.freq==='none') return ''; if(r.freq==='custom'){ const u={day:'day',week:'week',month:'month',year:'year'}[r.unit]; return r.n==1?`Every ${u}`:`Every ${r.n} ${u}s`; } return (REPEATS.find(x=>x[0]===r.freq)||[,''])[1]; };
const alertLabel = a => (ALERTS.find(x=>x[0]===String(a))||[,''])[1];
const monthStep = r => ({month:1,quarter:3,'6month':6,year:12})[r.freq] || (r.freq==='custom'&&r.unit==='month'?Math.max(1,+r.n||1):r.freq==='custom'&&r.unit==='year'?12*Math.max(1,+r.n||1):null);
function nextOcc(day, r){
  const ms=monthStep(r);
  if(ms){ const base=r.start||day; let k=1, nx; do{ nx=addM(base,k*ms); k++; }while(nx<=day && k<2000); return nx; }   // keeps the 31st on month-ends
  const d=new Date(day+'T12:00');
  const add=(unit,n)=>{ if(unit==='day') d.setDate(d.getDate()+n); else if(unit==='week') d.setDate(d.getDate()+7*n); else if(unit==='month') return addM(day,n); else if(unit==='year') return addM(day,12*n); return dstr(d); };
  switch(r.freq){
    case 'day': return add('day',1);
    case 'weekday': do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); return dstr(d);
    case 'week': return add('week',1);
    case '2week': return add('week',2);
    case 'month': return addM(day,1);
    case 'quarter': return addM(day,3);
    case '6month': return addM(day,6);
    case 'year': return addM(day,12);
    case 'custom': return add(r.unit, Math.max(1,+r.n||1));
  }
  return null;
}
const isRep = x => x.repeat && x.repeat.freq && x.repeat.freq!=='none';
/* every date a pending task falls on between from and to (inclusive) */
function occurrences(x, from, to){
  if(x.done) return [];
  if(!isRep(x)) return (x.due>=from && x.due<=to)?[x.due]:[];
  const out=[]; let d=x.due, n=0;
  while(d && d<=to && n<500){ if(x.repeat.until && d>x.repeat.until) break; if(d>=from) out.push(d); d=nextOcc(d,x.repeat); n++; }
  return out;
}
const whenLabel = x => { const today=dstr(new Date()), t=x.allDay===false&&x.time?' '+x.time:''; return (x.due===today?'Today':fmt(x.due))+t; };
function taskMeta(x){
  const bits=[];
  if(isRep(x)) bits.push(`<span class="tm">${ic('repeat')}${repLabel(x.repeat)}</span>`);
  if(x.alert && x.alert!=='none') bits.push(`<span class="tm">${ic('bell')}${alertLabel(x.alert).replace(' before','')}</span>`);
  if(x.location) bits.push(`<span class="tm">${ic('pin')}${esc(x.location)}</span>`);
  return bits.length?`<span class="tmeta2">${bits.join('')}</span>`:'';
}
function alertDue(x){ /* the moment the first alert fires, or null */
  if(x.done||!x.alert||x.alert==='none') return null;
  const at=new Date(x.due+'T'+(x.allDay===false&&x.time?x.time:'09:00')); return new Date(at.getTime()-(+x.alert)*60000);
}
const firedAlerts = () => tasks.filter(x=>{ const a=alertDue(x); return a && a<=new Date(); });

      <h2 class="sec">Add-ons</h2>${Object.entries(ADDONS).map(([k,a])=>`<div class="log"><span>${a.name} · ${a.price?`£${a.price} pcm`:'price TBC'}</span>${owned[k]?`<button class="pill ${owned[k].cancel?'out':'in'}" onclick="cancelSheet('${k}')">${owned[k].cancel?'Ends '+fmt(subDates(owned[k].start).renew):(owned[k].plan==='upfront'?'Paid yearly':'Monthly')+' · renews '+fmt(subDates(owned[k].start).renew)}</button>`:`<button class="pill out" onclick="buy('${k}')">Buy Now</button>`}</div>`).join('')}`,
    'Customised Tasks':`<p>${tasks.length} of 10 custom tasks in use.</p>`,
    'Log Out':`<p>Sign out of Tremcore on this device?</p><button class="btn-gold" onclick="closeSheet();toast('Signed out (demo)')">Log Out</button>`
  }[l];
  sheet(`<h2>${l}</h2>${info}<button class="btn-line" onclick="closeSheet()">Close</button>`);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(true); });

/* ---------- embedded add-ons: Reviews and Poster Generator run as their own pages inside the app ---------- */
const EMBED_SRC = {reviews:'addons/reviews.html', posters:'addons/posters.html'};
const embedCache = {};
/* the add-on pages use the app's Download and Claude permissions through this bridge */
window.__tremBridge = { use: async name=>{
  let ns=null; try{ ns = window.claude && await window.claude.use(name); }catch(e){ ns=null; }
  if(!ns) return null;
  if(name==='downloads') return { save: async o=>{ let d=o&&o.data;
    if(d && typeof d!=='string' && !(d instanceof Blob) && typeof d.arrayBuffer==='function') d=new Blob([await d.arrayBuffer()],{type:d.type||''});
    return ns.save({...o, data:d}); } };
  if(name==='sample'){
    const wrap=o=>{ if(!o) return o; const x={...o}; if(o.signal){ const ac=new AbortController(); if(o.signal.aborted) ac.abort(); else o.signal.addEventListener('abort',()=>ac.abort()); x.signal=ac.signal; } return x; };
    const f=(input,o)=>ns(input,wrap(o)); if(ns.json) f.json=(input,o)=>ns.json(input,wrap(o)); if(ns.limits) f.limits=(...a)=>ns.limits(...a); return f;
  }
  return ns;
}};
function embedHTML(s){
  if(!embedCache[s]) embedCache[s]=fetch(EMBED_SRC[s]).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).catch(e=>{ delete embedCache[s]; throw e; });
  return embedCache[s];
}
async function mountEmbed(s, el, hash){
  if(!el) return;
  try{
    let html = await embedHTML(s);
    const boot = `<script>window.__TREM_EMBED=1;window.__TREM_HASH=${JSON.stringify(hash||'')};try{window.claude=parent.__tremBridge}catch(e){}<\/script>`;
    html = html.replace(/<head>/i, m=>m+boot);
    if(!el.isConnected) return;
    const f=document.createElement('iframe'); f.title=ADDONS[s].name; f.setAttribute('allow','clipboard-write'); f.srcdoc=html; el.replaceWith(f);
  }catch(e){
    if(el.isConnected) el.innerHTML=`<div>${ADDONS[s].name} couldn't load. Check your connection and try again.<br><button class="btn-line" onclick="render()">Try Again</button></div>`;
  }
}
/* a customer scanning a feedback QR card opens straight onto the guest rating page */
if(/^#fb-/.test(location.hash)){
  const g=document.createElement('div'); g.className='guest-full'; g.innerHTML='<div class="embed-load" id="emb-guest">Loading…</div>';
  document.body.append(g); $('#app').setAttribute('aria-hidden','true');
  const el=g.firstElementChild; el.id=''; mountEmbed('reviews', el, location.hash);
}
render();
</script>
